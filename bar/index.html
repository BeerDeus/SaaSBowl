<body>
<!-- Le bar sur téléphone : le QR code (ou la puce NFC) de la piste 7 ouvre bar/?piste=7.
     Même parcours que le module Bar des bornes (carte, panier, paiement), réglé au même endroit : CRM › Sandbox › Bar.
     Carte bancaire : paiement en ligne (simulé pour l'instant). Espèces : la commande attend d'être payée sur une grande borne, au comptoir. -->
<div id="borne"><div id="ecran"></div><div id="couche"></div><div id="hl" role="status" hidden></div></div>
<script>window.__erreurs = []; addEventListener('error', e => __erreurs.push((e.message || 'erreur') + ' (' + String(e.filename || '').split('/').pop().split('?')[0] + ':' + e.lineno + ')'));
window.BORNE_ID = 'MOBILE';</script>

<script src="../borne/borne.js?v=41"></script>
</body>
