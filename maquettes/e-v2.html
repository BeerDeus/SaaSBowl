/* ---------- Décaler une réservation (fiche « Commande #… ») : un autre jour, une autre heure ----------
   Les heures proposées sont celles où la réservation tiendrait (même formule, même nombre ; la salle est gardée si elle est libre).
   Le prix convenu ne change pas. Le site, les bornes et le comptoir suivent aussitôt (moteur). */
const decalable = r => r.jour >= AUJ && !r.arrive && !['absente', 'validee', 'pointee'].includes(r.etatV) && !r.attente && droit('planning');
function heuresDecalage(r, j) {
  const a = actById(r.act); if (!a || !window.SB) return [];
  return SB.moteur.grille(SB.etat(), SB.etat().config.activites.find(x => x.id === r.act) || a, j).slots
    .filter(sl => !(j === r.jour && mn(sl.h) === r.debut) && (j > AUJ || mn(sl.h) > NOW))
    .map(sl => ({ h: sl.h, sim: SB.api.reservations.simuler({ act: r.act, j, h: sl.h, formule: r.formule, pers: r.pers, total: r.total }, r.id) }))
    .filter(x => x.sim.ok);
}
function blocDecaler(r) {
  if (!decalable(r)) return '';
  const D = S.decal && S.decal.id === r.id ? S.decal : null;
  if (!D) return `<div class="row wrap"><button type="button" class="btn pt" data-a="decal" data-id="${r.id}">${ic('planning', 14)}Changer le jour ou l’heure</button></div>`;
  const H = heuresDecalage(r, D.j), L = jourLib(D.j);
  return `<div class="decal"><span class="lab clair">Décaler la réservation</span>
    <div class="row wrap"><label class="champ" style="flex:0 1 190px">Jour<input class="in" type="date" value="${SB.temps.isoDeJour(D.j)}" min="${SB.temps.isoDeJour(AUJ)}" data-f="decalJour"></label><span class="note">${esc(L.long)} · ${esc(r.formule)} · ${r.pers} pers.</span></div>
    <div class="chips">${H.map(x => `<button type="button" class="chip ${D.h === x.h ? 'on' : ''}" data-a="decalH" data-h="${x.h}" aria-pressed="${D.h === x.h}">${x.h}</button>`).join('') || '<span class="note">Aucune heure libre ce jour-là pour cette formule et ce nombre : essayez un autre jour.</span>'}</div>
    ${D.h ? (() => { const x = H.find(y => y.h === D.h), px = x && x.sim.prix ? x.sim.prix.total : r.total;
      return `${Math.abs(px - r.total) > 0.01 ? `<p class="note">Au tarif de ce jour-là, ce serait ${eur(px)} : le prix convenu (${eur(r.total)}) ne change pas.</p>` : ''}<div class="row wrap"><button type="button" class="btn pt pri" data-a="decalOk">Déplacer au ${esc(L.long.toLowerCase())} à ${D.h}</button><button type="button" class="btn pt" data-a="decalNon">Annuler</button></div>`; })()
      : `<div class="row wrap"><button type="button" class="btn pt" data-a="decalNon">Annuler</button></div>`}</div>`;
}
Object.assign(ACTIONS, {
  decal(d) { const r = CENTRE.reservations.find(x => x.id === d.id); if (!r) return false; S.decal = { id: r.id, j: r.jour, h: null }; },
  decalH(d) { if (S.decal) S.decal.h = d.h; },
  decalNon() { S.decal = null; },
  decalOk() {
    const D = S.decal, r = D && CENTRE.reservations.find(x => x.id === D.id); if (!r || !D.h) return false;
    const res = SB.api.reservations.modifier(r.id, { j: D.j, h: D.h, total: r.total }, 'crm');

  }
});

/* ---------- Paramétrage › Calendrier : vacances scolaires (API ouverte de l'Éducation nationale) et jours fériés (calculés) ----------
   Le CRM met à jour les vacances de la zone du centre tout seul, au plus une fois par semaine à son ouverture, et les range dans la config :
   le moteur, les bornes et le site s'en servent (tarifs « vacances scolaires », templates de créneaux). Sans réseau : la dernière liste reçue.
   ponytail: c'est le CRM ouvert qui va chercher ; avec le vrai serveur, une tâche planifiée le fera (même URL, même tri). */
const CALENDRIER = { zone: 'C', vacances: [], maj: 0, zoneMaj: '', erreur: '' };

async function majCalendrier(force) {
  const C = CALENDRIER;
  if (!force && C.vacances.length && C.zoneMaj === C.zone && Date.now() - C.maj < 7 * 864e5) return;
  const depuis = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
  try {
    const r = await fetch(API_VACANCES + '?' + new URLSearchParams({ where: `zones="Zone ${C.zone}" and end_date >= "${depuis}"`, order_by: 'start_date' }));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const vus = new Map();     // une ligne par académie : on garde une période par nom et date ; l'été « Enseignants » est écarté (celui des élèves reste)
    (await r.json()).filter(x => x.population !== 'Enseignants' && /^Vacances/i.test(x.description || '') && x.start_date && x.end_date)
      .forEach(x => { const v = { nom: x.description.trim(), du: jourApi(x.start_date), au: jourApi(x.end_date), annee: x.annee_scolaire || '' }; vus.set(v.nom + v.du, v); });
    if (!vus.size) throw new Error('aucune période reçue');
    Object.assign(C, { vacances: [...vus.values()].sort((a, b) => a.du < b.du ? -1 : 1), maj: Date.now(), zoneMaj: C.zone, erreur: '' });
    if (force) S.toast = C.vacances.length + ' périodes de vacances reçues pour la zone ' + C.zone;
  } catch (e) { C.erreur = 'Mise à jour impossible (' + e.message + ') : la dernière liste reçue reste utilisée.'; if (force) S.toast = C.erreur; }

  document.getElementById('app').innerHTML = rendre();
}

/* Frise : la ligne du haut porte les créneaux (heure + état, cliquables), puis une ligne par salle avec les réservations à leur vraie durée */
function friseJour(a, j, o = {}) {
  const sl = (SLOTS[a.id] || []).filter(s => s.j === j).sort((x, y) => mn(x.h) - mn(y.h)), R = a.ressources;
  const d0 = sl.length ? Math.floor(mn(sl[0].h) / 60) * 60 : 14 * 60, d1 = sl.length ? Math.ceil(Math.max(...sl.map(finSlot)) / 60) * 60 : 23 * 60, span = Math.max(60, d1 - d0);

    CENTRE.activites.filter(a => !vus.has(a.id) && (a.canaux.includes('borne') || a.canaux.includes('web'))).forEach(a => DIFFUSION.boutons.push({ act: a.id, lib: a.nom, sous: '', image: '', ordre: 999, visible: true }));
    DIFFUSION.boutons.slice().sort((x, y) => x.ordre - y.ordre).forEach((b, i) => { b.ordre = i + 1; });      // 1, 2, 3… sans trou : les flèches marchent
    if (annivLu < 2) { annivLu = 2; genererTemplate('anniv', AUJ, AUJ + 56, TEMPLATES.anniv[0]); }   // une fois, après le chargement de toute la sandbox
    CENTRE.activites.forEach(a => (a.ressources || []).forEach(x => { if (x.act !== a.id) x.act = a.id; }));   // forme stable (toutesRessources l'ajoute sinon)
    CENTRE.activites.forEach(a => {
      if (a.modele === 'vente' || a.modele === 'combo' || CRENEAUX[a.id]) return;
      CRENEAUX[a.id] = J7.map((_, i) => { const b = { ouvert: true, debut: i >= 5 || i === 2 ? '10:00' : '14:00', fin: i === 4 || i === 5 ? '00:00' : '23:00', pas: (a.duree || 30) >= 60 ? 60 : 30 }; return { jour: J7[i], web: { ...b, ouvert: false }, borne: { ...b, ouvert: false }, comptoir: { ...b } }; });
    });
    if (!actById(S.act) && CENTRE.activites[0]) S.act = CENTRE.activites[0].id;
    if (S.gen && !actById(S.gen.act) && CENTRE.activites[0]) S.gen.act = CENTRE.activites[0].id;
  }
  function charger(cles) {
    cles.forEach(cle => { const d = SB.lire(cle); if (d == null) return; appliquer(cle, SB.copie(d)); if (PART.includes(cle)) retenir(cle, d); });
  }
  function sauver() {
    completer();            // une activité tout juste créée ici reçoit ses heures comptoir avant de partir vers le front
    const ph = photo(); let n = 0;
    PART.forEach(cle => {
      const j = JSON.stringify(ph[cle]);
      if (j === baseJson[cle]) return;
      const mien = JSON.parse(j), leur = SB.lire(cle), b = base[cle];
      let fin;
      if (!leur || !b) fin = mien;
      else if (cle === 'reservations') fin = SB.fusionListe(b, mien, leur);
      else if (cle === 'creneaux') fin = SB.fusionMap(b, mien, leur, true);
      else if (cle === 'tickets') fin = { lots: SB.fusionListe(b.lots, mien.lots, leur.lots), codes: SB.fusionListe(b.codes, mien.codes, leur.codes), usages: SB.fusionListe(b.usages, mien.usages, leur.usages), refus: leur.refus || [] };
      else fin = Object.assign({}, leur, mien, { activites: SB.fusionListe(b.activites, mien.activites, leur.activites), prix: SB.fusionMap(b.prix, mien.prix, leur.prix, false), regles: SB.fusionMap(b.regles, mien.regles, leur.regles, false) });
      SB.modifier(cle, () => fin, 'crm');
      retenir(cle, fin);
      if (JSON.stringify(fin) !== j) appliquer(cle, SB.copie(fin));
      n++;
    });
    return n;
  }

  /* ---- 1. amorçage ou chargement ---- */
  if (!SB.pret()) {
    /* affichées sur le front au départ ; leurs chronos rapides viennent des formules (moins 2 min) */
    const visibles = { laser: true, karaoke: true, quiz: true, billard: false, bowling: false };
    CENTRE.activites.forEach(a => { if (a.id in visibles) a.front = { visible: visibles[a.id] }; });
    /* lien avec les 4 chronos historiques de l'onglet Anniversaires (1 = bas, 2 = haut, 3 = karaoké, 4 = quiz) */
    const anciens = { LB: 1, LH: 2, KA: 3, QZ: 4 };
    CENTRE.activites.forEach(a => (a.ressources || []).forEach(x => { if (anciens[x.id]) x.legacy = anciens[x.id]; }));
    completer();
    SB.amorcer(Object.assign({ jour0: SB.temps.iso(JOUR0) }, SB.copie(photo()), { blocages: [], chronos: {}, reglages: { attente: 15, numero: 270400 } }), 'crm');
    PART.forEach(cle => retenir(cle, SB.lire(cle)));
  } else {
    charger(LUS);
    completer();
  }

  appliquerVentes(SB.lire('ventes') || {});          // les commandes bar sont celles des bornes, même quand il n'y en a encore aucune
  /* commandes bar à traiter (Bar › Commandes) : on encaisse le reste au comptoir, ou on classe la commande abandonnée */
  Object.assign(ACTIONS, {
    barEncaisser(d) { const c = COMMANDES_BAR.find(x => x.num === +d.n); if (!c) return false;
      const reste = Math.max(0, Math.round((c.total - (c.paye || 0) - (c.remise || 0) - (c.acompte || 0)) * 100) / 100);
      const r = SB.api.bar.payer(c.num, { moyen: 'Comptoir', montant: reste, lignes: [['Reste de la commande', 1, reste, 10]], ok: true, op: 'crm-' + c.num + '-' + Date.now().toString(36), ts: Date.now() }, 'crm');
      appliquerVentes(SB.lire('ventes') || {}); S.toast = r.ok ? 'Commande #' + c.num + ' : ' + eur(reste) + ' encaissés au comptoir, commande validée' : r.raison; },
    barAbandon(d) { SB.api.bar.abandonner(+d.n, 'crm', true); appliquerVentes(SB.lire('ventes') || {}); S.toast = 'Commande #' + d.n + ' classée abandonnée'; }
  });
  /* ---- 2. le CRM calcule la disponibilité avec le moteur partagé ---- */
  const etatCRM = () => ({ config: { activites: CENTRE.activites, prix: PRIX, regles: CRENEAUX }, creneaux: SLOTS, reservations: CENTRE.reservations, blocages: BLOCAGES, chronos: CHRONOS });
  etatSlot = s => SB.moteur.etatSlot(etatCRM(), s);

  /* ---- 3. chaque rendu enregistre ce qui a changé ---- */
  const rendreBase = rendre;
  rendre = function () { const html = rendreBase(); setTimeout(() => { try { sauver(); } catch (e) { console.error('[sandbox] sauvegarde', e); } }, 0); return html; };
  let tSaisie = null;
  const differer = () => { clearTimeout(tSaisie); tSaisie = setTimeout(() => { try { sauver(); } catch (e) { console.error(e); } }, 350); };
  document.addEventListener('input', differer);
  document.addEventListener('change', differer);

  /* ---- 4. ce que le front employé fait arrive ici en direct ---- */
  const app = () => document.getElementById('app');
  let enAttente = false;
  function redessiner() {
    const f = document.activeElement;
    if (f && app() && app().contains(f) && /INPUT|TEXTAREA|SELECT/.test(f.tagName)) { enAttente = true; return; }
    enAttente = false;
    const y = window.scrollY;
    app().innerHTML = rendreBase();
    window.scrollTo(0, y);
  }
  document.addEventListener('focusout', () => setTimeout(() => { if (enAttente) redessiner(); }, 60));
  const fil = document.createElement('div');
  fil.id = 'sbx-fil'; fil.setAttribute('aria-live', 'polite');
  fil.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px));pointer-events:none';
  document.body.appendChild(fil);
  function annoncer(ev) {
    const x = texteEvt(ev); if (!x) return;
    const n = document.createElement('div');
    n.style.cssText = 'background:var(--n);color:#fff;padding:10px 14px;border-left:5px solid var(--sky);border-radius:3px;box-shadow:0 6px 18px rgba(12,47,71,.25);font-size:14px;line-height:1.35';
    n.innerHTML = `<span style="font:700 10px var(--mono);letter-spacing:.08em;opacity:.7;text-transform:uppercase">${esc(x.o)}</span><br><b>${esc(x.t)}</b>${x.s ? `<br><span style="opacity:.85">${esc(x.s)}</span>` : ''}`;
    fil.appendChild(n);
    setTimeout(() => n.remove(), x.s ? 9000 : 6000);
  }
  SB.ecouter(m => {
    if (m.local) return;
    if (m.evt) { annoncer(m.evt); return; }
    const c = (m.cles || []).filter(k => LUS.includes(k));
    if (!c.length) return;
    try { sauver(); } catch (e) { console.error(e); }
    charger(c);
    completer();
    redessiner();
  });

  /* ---- 5. horloge réelle et chronos qui tournent ---- */
  setInterval(() => { const t = SB.temps.maintenant(); if (t.min !== NOW || t.j !== AUJ) { const jour = t.j !== AUJ; if (S.jour === AUJ && jour) S.jour = t.j; NOW = t.min; AUJ = t.j; if (S.ecran === 'tdb') redessiner(); } }, 30000);
  /* commandes « espèces au comptoir » pas payées à temps : annulées (le serveur le fera tout seul) */
  const expirer = () => { try { if (SB.api.bar.expirer('crm')) { appliquerVentes(SB.lire('ventes') || {}); redessiner(); } } catch (e) { console.error(e); } };
  expirer(); setInterval(expirer, 20000);
  /* le parc des bornes suit les signes de vie (heartbeat) : l'écran Gestion des bornes et le tableau de bord se redessinent quand un état change */
  setInterval(() => { if ((S.ecran === 'bornes' && !S.parcEdit && !S.flotteConf) || (S.ecran === 'tdb' && !S.edit)) { if (majEtatBornes()) redessiner(); } }, 15000);
  setInterval(() => document.querySelectorAll('[data-sbx-fin]').forEach(el => { const r = +el.dataset.sbxFin - Date.now(); el.textContent = fmtMs(r); el.style.color = r < 0 ? 'var(--rouge)' : r < 60000 ? 'var(--amber)' : ''; }), 1000);
  window.__sbxCRM = { sauver, charger, photo };
})();

/* un clic sur un écran, une activité ou un onglet ramène toujours à aujourd’hui (planning, créneaux) : jamais la date d’une visite précédente */
['aller', 'ouvrir', 'sousO'].forEach(k => { const f = ACTIONS[k]; ACTIONS[k] = d => { S.jour = AUJ; S.slotJ = null; S.slotSel = null; S.sel = null; S.supConf = null; return f(d); }; });
/* Supprimer une activité : l'Admin seulement, en deux clics (le premier demande confirmation) */
function boutonSupAct(a, lib) {
  if (S.role !== 'Admin') return '';
  return S.supConf === a.id ? `<span class="row" style="gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end"><span class="note"><b style="color:var(--rouge)">Irréversible</b> : « ${esc(a.nom)} » et tout son paramétrage seront supprimés.</span><button type="button" class="btn att" data-a="supActivite" data-id="${a.id}">Oui, supprimer définitivement</button><button type="button" class="btn pt" data-a="supActNon">Annuler</button></span>`
    : `<button type="button" class="btn pt att" data-a="supActivite" data-id="${a.id}" style="margin-left:auto">${lib}</button>`;
}
{ const f = ACTIONS.supActivite; ACTIONS.supActivite = d => { if (S.role !== 'Admin') { S.toast = 'Seul un administrateur peut supprimer une activité'; return; } if (S.supConf !== d.id) { S.supConf = d.id; return; } S.supConf = null; return f(d); }; }
ACTIONS.supActNon = () => { S.supConf = null; };
monter(rendre, ACTIONS, (chemin, v, el) => {
  const go = () => { document.getElementById('app').innerHTML = rendre(); };
  if (chemin === 'role') { S.role = v; S.edit = false; if (!droit('voir_ca') && S.ecran === 'stats' || !droit('comptes') && S.ecran === 'comptes' || !droit('parametrage') && S.ecran === 'parametrage' || !droit('sandbox') && S.ecran === 'sandbox' || !droit('clients') && S.ecran === 'clients') { S.ecran = 'tdb'; S.client = null; } if (!droit('clients')) S.client = null; return go(); }
  if (chemin === 'noteJour') { if (window.SB) SB.api.reglages({ note: v }, 'crm'); return; }
  if (chemin === 'date') { if (v && v.slice(0, 4) >= '2020') { S.jour = Math.min(AUJ + 90, Math.max(AUJ - 60, jourDeIso(v))); S.slotSel = null; go(); } return; }
  if (chemin === 'slotDate') { if (v && v.slice(0, 4) >= '2020') { S.slotJ = Math.min(AUJ + 120, Math.max(AUJ - 60, jourDeIso(v))); go(); } return; }
  if (chemin === 'mois') { if (v !== '') { S.jour = +v; S.slotSel = null; go(); } return; }
  if (chemin === 'filtreBorne' || chemin === 'filtreMoyen' || chemin === 'flotteZone' || chemin === 'rechTrans' || chemin === 'rechBar' || chemin === 'codeQ' || chemin === 'nouvZone') { S[chemin] = v; if (chemin === 'flotteZone') S.flotteConf = null; if (chemin !== 'rechTrans' && chemin !== 'rechBar' && chemin !== 'codeQ' && chemin !== 'nouvZone') go(); else if (chemin !== 'nouvZone') { const pos = el.selectionStart; go(); const n = document.querySelector('[data-f=' + chemin + ']'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } return; }
  const p = chemin.split('.');
  if (p[0] === 'zone') { const old = CENTRE.zones[+p[1]]; CENTRE.zones[+p[1]] = v; if (S.flotteZone === old) S.flotteZone = v; CENTRE.bornes.forEach(b => { if (b.zone === old) b.zone = v; }); return; }
  if (p[0] === 'borneNom') { CENTRE.bornes.find(b => b.id === p[1]).nom = v; return; }
  if (p[0] === 'borneZone') { CENTRE.bornes.find(b => b.id === p[1]).zone = v; go(); return; }
  if (SAISIE[p[0]]) { SAISIE[p[0]](p.slice(1), v, el); return; }
  if (S[p[0]] && typeof S[p[0]] === 'object') S[p[0]][p[1]] = v;
});
</script>
