<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM SpaceBowling Engine — version 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.scrollx{overflow-x:auto}
/* frise par ressource (structure seulement, l'habillage est propre à chaque maquette) */
.tl{min-width:860px}
.tl-head,.tl-row{display:flex;align-items:stretch}
.tl-lab{flex:0 0 150px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.tl-lab em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em}
.tl-lab .pt{width:8px;height:8px;border-radius:2px;flex:none}
.tl-hours{flex:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr))}
.tl-hours span{font-size:11px;padding:7px 0 7px 6px}
.tl-track{flex:1;position:relative;height:40px;background-image:linear-gradient(to right,var(--grille) 1px,transparent 1px);background-size:10% 100%}
.tl-b{position:absolute;top:4px;bottom:4px;border-radius:5px;padding:0 7px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b.terne{opacity:.22}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--maintenant);pointer-events:none}

/* ---- Identité : enseigne de bowling. Marine du logo pour la colonne, crème pour le fond, bleu ciel pour ce qui est actif, rouge des quilles pour ce qui alerte. Pas de quadrillage, pas de cartouche. ---- */
:root{--n:#0c2f47;--n2:#143f5e;--encre:#1a2430;--doux:#5b6b78;--creme:#f3efe6;--papier:#fffdf9;--ligne:#d9d1c1;--ligne2:#ebe5d8;--sky:#00aee0;--sky2:#0a8fbf;--skyp:#e2f4fb;--rouge:#d9272e;--vert:#1e8e3e;--amber:#d9900a;--grille:#efe9dc;--maintenant:#d9272e;--acc:#d9272e;--peche:#e2f4fb;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--cond:'Barlow Semi Condensed','Arial Narrow',sans-serif}
body{background:var(--creme);color:var(--encre);font:15px/1.45 'Barlow',system-ui,'Segoe UI',sans-serif}
.shell{display:flex;min-height:100vh}
.arbre{flex:none;width:246px;background:var(--n);color:#e9eef2;padding:16px 12px 14px;display:flex;flex-direction:column;gap:14px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.marque{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 6px 10px;border-bottom:1px solid rgba(255,255,255,.14)}
.logo{height:64px;width:auto;display:block}
.marque small{font:500 11px var(--mono);color:#9fb4c4}
.et{font:700 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:#7fd4f2;padding:0 8px;display:flex;align-items:center;gap:6px;min-height:22px}
.et.ouvre{cursor:pointer;width:100%;text-align:left}
.et.ouvre svg{transition:transform .15s;transform:rotate(90deg)} .et.ouvre.plie svg{transform:rotate(0)}
.grp{display:flex;flex-direction:column;gap:1px}
.grp button{display:flex;align-items:center;gap:9px;min-height:36px;padding:0 10px 0 8px;font-weight:500;color:#e9eef2;border-left:4px solid transparent;border-radius:0 3px 3px 0;font-size:15px}
.grp button:hover{background:rgba(255,255,255,.07)}
.grp button.on{background:var(--creme);color:var(--n);font-weight:600;border-left-color:var(--sky)}
.grp button svg{opacity:.75} .grp button.on svg{opacity:1}
.grp button i{width:10px;height:10px;background:var(--c);border:1.5px solid rgba(255,255,255,.7);flex:none;border-radius:2px}
.grp button.on i{border-color:var(--n)}
.grp .br{margin-left:auto;font:700 10px var(--mono);color:#ffb3b6}
.grp button.on .br{color:var(--rouge)}
.grp .plus{color:#7fd4f2;font-weight:600}
.et .ic-et{margin-left:auto;min-height:24px;padding:0 5px;border-left:0;color:#7fd4f2} .et .ic-et[aria-pressed="true"]{background:var(--sky);color:#fff}
.grp .ord-l{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 4px 0 12px;color:#e9eef2;font-size:15px;font-weight:500;background:rgba(255,255,255,.05);border-radius:0 3px 3px 0}
.grp .ord-l i{width:10px;height:10px;background:var(--c);border:1.5px solid rgba(255,255,255,.7);flex:none;border-radius:2px}
.grp .ord-l button{min-height:28px;padding:0 4px;border-left:0} .grp .ord-l button svg{transform:rotate(90deg);opacity:1} .grp .ord-l button:disabled{opacity:.25}
.grp.sg{padding-left:12px;border-left:1px solid rgba(255,255,255,.18);margin-left:12px}
.grp.sg button{font-size:14.5px;color:#f4f7f9;min-height:34px}
.grp.sg button.on{background:var(--creme);color:var(--n)}
.bas-arbre{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding-top:10px}
.bas-arbre button{font:700 14px var(--cond);letter-spacing:.1em;text-transform:uppercase}
.barre{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 26px;background:var(--papier);border-bottom:1px solid var(--ligne);min-height:58px}
.fil{font:600 18px var(--cond);color:var(--doux);text-transform:uppercase;letter-spacing:.04em} .fil b{color:var(--n)}
.sw{display:inline-flex;align-items:center;gap:10px;min-height:36px;padding:0 12px;border:1px solid var(--ligne);background:#fff;font-weight:600;border-radius:3px}
.sw span{width:34px;height:18px;border:1.5px solid var(--n);border-radius:99px;position:relative;background:#fff}
.sw span::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--n)}
.sw.on{border-color:var(--sky2);background:var(--skyp)} .sw.on span{background:var(--sky);border-color:var(--sky)} .sw.on span::after{left:18px;background:#fff}
.compte{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border:1px solid var(--ligne);background:#fff;font-size:14px;border-radius:3px}
.compte select{border:0;background:none;font:600 14px 'Barlow',sans-serif;color:var(--n)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 13px;border:1px solid var(--n);font-weight:600;background:#fff;white-space:nowrap;font-size:14px;color:var(--n);border-radius:3px}
.btn:hover{background:var(--skyp)}
.btn.pri{background:var(--n);color:#fff} .btn.pri:hover{background:var(--n2)}
.btn.acc{background:var(--rouge);border-color:var(--rouge);color:#fff} .btn.acc:hover{background:#b51e24}
.btn.sky{background:var(--sky);border-color:var(--sky);color:#fff} .btn.sky:hover{background:var(--sky2)}
.btn.pt{min-height:30px;padding:0 9px;font-size:13px}
.btn.att{color:var(--rouge);border-color:var(--rouge)}
.btn[disabled]{opacity:.45;cursor:default}
.ic{width:30px;height:30px;border:1px solid var(--ligne);display:inline-grid;place-items:center;background:#fff;flex:none;border-radius:3px;color:var(--n)}
.ic:hover{background:var(--skyp);border-color:var(--sky2)}
.page{padding:20px 26px 60px;display:flex;flex-direction:column;gap:16px}
.page>h1{font:700 30px/1 var(--cond);text-transform:uppercase;letter-spacing:.03em;color:var(--n);margin:0;display:flex;align-items:baseline;gap:12px}
.page>h1::after{content:'';flex:0 0 46px;height:4px;background:var(--sky);align-self:center}
.page>p.intro{color:var(--doux);max-width:860px;margin:-6px 0 0}
.bloc{background:var(--papier);border:1px solid var(--ligne);min-width:0;position:relative;border-radius:3px}
.bloc>header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--ligne2);min-height:44px;flex-wrap:wrap}
.lab{font:700 15px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--n);white-space:nowrap;padding-left:10px;position:relative}
.lab::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;background:var(--sky)}
.lab.clair{font-size:13px;color:var(--doux)} .lab.clair::before{background:var(--ligne)}
.bloc>header b{font-weight:600;color:var(--encre)} .bloc>header .sp{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--doux);font-size:13.5px;flex-wrap:wrap}
.corps{padding:12px 14px}
.widgets{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.w3{grid-column:span 3} .w4{grid-column:span 4} .w5{grid-column:span 5} .w6{grid-column:span 6} .w7{grid-column:span 7} .w8{grid-column:span 8} .w12{grid-column:span 12}
.edit .bloc.w{outline:2px dashed var(--sky);outline-offset:4px}
.gros{font:700 34px/1.1 var(--cond);letter-spacing:.01em;color:var(--n)}
.gros.masque{font:italic 500 14px 'Barlow',sans-serif;color:var(--doux)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio>div{display:flex;flex-direction:column;gap:2px}
.trio span{font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--doux)}
.trio b{font:700 26px/1.1 var(--cond);color:var(--n)}
.note{color:var(--doux);font-size:13.5px}
.delta{font:600 12px var(--mono);padding:1px 6px;border-radius:2px;display:inline-block;background:var(--ligne2);color:var(--doux)}
.delta.up{color:var(--vert);background:#e3f3e7} .delta.down{color:var(--rouge);background:#fbe6e7}
.lig{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--ligne2)}
.lig:first-child{border-top:0}
.lig small{display:block;color:var(--doux);font-size:13px}
.lig .h{font:700 16px var(--cond);width:48px;flex:none;color:var(--n)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--vert);flex:none;display:inline-block}
.dot.off{background:var(--rouge)} .dot.warn{background:var(--amber)} .dot.g{background:#b8c0c8}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:1px 7px;background:var(--p);border-radius:2px;color:var(--encre);white-space:nowrap}
.etat{font-weight:700;font-size:13px}
.etat.arrive,.etat.ok,.etat.v{color:var(--vert)} .etat.retard,.etat.anomalie,.etat.o{color:var(--amber)} .etat.attendu,.etat.termine,.etat.g{color:var(--doux)} .etat.refusee,.etat.off,.etat.r{color:var(--rouge)}
.jours{display:flex;align-items:center;gap:6px;flex-wrap:wrap} .jours strong{min-width:168px;text-align:center;font:700 18px var(--cond);text-transform:uppercase;letter-spacing:.03em;color:var(--n)}
.jours input[type=date]{height:32px;border:1px solid var(--ligne);padding:0 8px;font:500 14px 'Barlow',sans-serif;border-radius:3px;background:#fff;color:var(--encre)}
.jours select{height:32px;border:1px solid var(--ligne);padding:0 6px;font:500 14px 'Barlow',sans-serif;border-radius:3px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 10px;border:1px solid var(--ligne);font-weight:500;font-size:13.5px;background:#fff;color:var(--doux);border-radius:3px}
.chip i{width:10px;height:10px;background:var(--p);border-radius:2px}
.chip.on{border-color:var(--sky2);color:var(--n);font-weight:600;background:var(--skyp)}
.sous{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--ligne)}
.sous button{padding:9px 14px;font:600 16px var(--cond);text-transform:uppercase;letter-spacing:.05em;color:var(--doux);border-bottom:3px solid transparent;margin-bottom:-1px}
.sous button:hover{color:var(--n)}
.sous button.on{color:var(--n);border-bottom-color:var(--sky)}
.sous .n{font:700 11px var(--mono);background:var(--rouge);color:#fff;padding:0 5px;margin-left:6px;border-radius:2px;letter-spacing:0}
.gj{min-width:760px;border-collapse:collapse}
.gj th{padding:6px;text-align:center;font:600 12px var(--cond);letter-spacing:.06em;color:var(--doux);border-bottom:1px solid var(--ligne)}
.gj th:first-child{text-align:left}
.gj td{padding:3px;border-top:1px solid var(--ligne2)}
.gj td:first-child{padding:3px 10px 3px 6px;white-space:nowrap;font-weight:600;font-size:13.5px}
.gj td:first-child small{display:block;font-weight:400;color:var(--doux);font-size:11.5px}
.cr{width:100%;min-height:40px;border:1px solid var(--ligne);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 13px var(--mono);background:#fff;color:var(--encre);border-radius:2px}
.cr small{font:500 10px var(--mono);color:var(--doux)}
.cr.partiel{background:var(--skyp);border-color:var(--sky2)}
.cr.complet{background:var(--n);color:#fff;border-color:var(--n)} .cr.complet small{color:#c7d7e3}
.cr.ferme{background:#fbe6e7;border-color:var(--rouge);color:var(--rouge);text-decoration:line-through}
.cr.hors{background:var(--creme);border-style:dashed;color:#9aa5ae}
.cr.sel{outline:2px solid var(--rouge);outline-offset:1px}
.cr:hover{border-color:var(--n)}
table{width:100%;border-collapse:collapse}
th{font:600 12.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:9px 10px;border-bottom:1px solid var(--ligne);white-space:nowrap;color:var(--doux)}
td{padding:8px 10px;border-top:1px solid var(--ligne2);vertical-align:middle}
td.m{font-family:var(--mono);font-weight:500;font-size:13px} td.r,th.r{text-align:right} td.c,th.c{text-align:center}
/* la classe .grp du menu (flex) s'appliquait aussi aux lignes de séparation des tableaux : la bande grise ne couvrait que la première colonne */
tr.grp{display:table-row}
tr.grp td{background:#e8e1d1;font:700 13px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--n);padding:9px 10px 9px 12px;border-top:2px solid var(--n);border-bottom:1px solid var(--ligne);box-shadow:inset 4px 0 0 var(--sky)}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--skyp)}
.lienb{font:600 13px var(--mono);color:var(--sky2);text-decoration:underline;text-underline-offset:2px;padding:0}
.jsem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.jj{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:1px solid var(--ligne);background:#fff;border-radius:3px;font-size:12px;color:var(--doux);min-width:0}
.jj b{font:700 13px var(--mono);color:var(--n);white-space:nowrap} .jj:hover{border-color:var(--sky2)}
.jj.on{background:var(--n);border-color:var(--n);color:#fff} .jj.on b{color:#fff}
.jj.vide{border-style:dashed} .jj.vide b{color:var(--doux);font-weight:500}
.case{width:30px;height:30px;border:1px solid var(--ligne);display:inline-grid;place-items:center;background:#fff;color:transparent;border-radius:3px}
.case.on{background:var(--p,var(--skyp));border-color:var(--n);color:var(--n)}
.case:hover{border-color:var(--n)}
.inter{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.inter span{width:32px;height:17px;border:1.5px solid var(--n);border-radius:99px;position:relative;background:#fff;flex:none}
.inter span::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--n)}
.inter.on span{background:var(--vert);border-color:var(--vert)} .inter.on span::after{left:17px;background:#fff}
.inter.off{color:var(--doux)}
.champ{display:flex;flex-direction:column;gap:4px;font:600 12.5px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
.champ input,.champ select,.champ textarea{min-height:38px;border:1px solid var(--ligne);padding:0 10px;font:500 14.5px 'Barlow',sans-serif;letter-spacing:0;text-transform:none;color:var(--encre);background:#fff;width:100%;border-radius:3px}
.champ textarea{padding:8px 10px;min-height:70px;resize:vertical}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:2px solid var(--sky);outline-offset:0}
.champ input[readonly]{background:var(--creme)}
.in{min-height:30px;border:1px solid var(--ligne);padding:0 8px;font:500 13.5px 'Barlow',sans-serif;background:#fff;border-radius:3px;color:var(--encre)}
.in:focus{outline:2px solid var(--sky)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:12px}
.mot{font:600 11.5px var(--mono);border:1px solid var(--ligne);padding:2px 6px;white-space:nowrap;border-radius:2px;background:#fff}
.mot.al{background:var(--skyp);border-color:var(--sky2);color:var(--n)} .mot.v{background:#e3f3e7;border-color:#9ccfab;color:var(--vert)} .mot.r{background:#fbe6e7;border-color:#f0a9ac;color:var(--rouge)} .mot.o{background:#fdf1dc;border-color:#f0cf8e;color:#9a6400} .mot.g{background:var(--creme);border-color:var(--ligne);color:var(--doux)}
.meth{font:700 11px var(--mono);padding:2px 6px;border:1px solid var(--ligne);min-width:44px;text-align:center;display:inline-block;border-radius:2px}
.meth.GET{background:#e3f1ff} .meth.POST{background:#dff3e6} .meth.PUT,.meth.PATCH{background:#fdf1dc} .meth.DELETE{background:#fbe6e7} .meth.WS{background:#efe7ff}
.si{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--ligne2)}
.si:first-child{border-top:0}
.recette{display:flex;flex-direction:column;max-width:960px}
.lien{width:1px;height:14px;background:var(--ligne);margin-left:28px}
.flux{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center}
.pas{min-height:34px;padding:0 10px;border:1px solid var(--n);font-weight:600;font-size:13px;background:#fff;display:inline-flex;align-items:center;border-radius:3px}
.pas.off{border-style:dashed;border-color:var(--ligne);color:#8d97a0;text-decoration:line-through;background:none}
.fle{width:18px;height:1px;background:var(--n);position:relative;flex:none}
.fle::after{content:'';position:absolute;right:0;top:-3.5px;border-left:6px solid var(--n);border-top:4px solid transparent;border-bottom:4px solid transparent}
.pm{display:inline-flex;align-items:center;gap:8px;font:700 15px var(--mono)}
.borne{background:var(--papier);border:1px solid var(--ligne);display:flex;flex-direction:column;font-size:13.5px;border-radius:3px}
.borne>header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--ligne2)}
.borne>header b{font-size:14.5px} .borne>header code{font:500 11px var(--mono);color:var(--doux)}
.borne .l{display:flex;align-items:center;gap:8px;padding:5px 10px;border-top:1px solid var(--grille)}
.borne .l span:last-child{margin-left:auto;text-align:right;color:var(--doux)}
.borne .l svg{color:var(--doux)}
.borne footer{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:7px 10px;border-top:1px solid var(--ligne2);margin-top:auto}
.borne.off{border-color:var(--rouge)} .borne.off>header{background:#fbe6e7}
.borne.eteinte{background:#f3f1eb} .borne.eteinte>header{background:#eceae4} .borne.eteinte .l span:last-child,.borne.eteinte b{color:var(--doux)}
.parc{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px}
.zoneT{display:flex;align-items:center;gap:10px;margin:6px 0 8px}
.zoneT h2{margin:0;font:700 18px var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--n)}
.sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--ligne2);border-top:1px solid var(--ligne2)}
.sem>div{background:var(--papier);min-height:120px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0}
.sem>div.auj{background:#f6fbfe}
.sem>div>h4{margin:0 0 2px;font:700 13.5px var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--doux);display:flex;justify-content:space-between}
.sem>div.auj>h4{color:var(--sky2)}

.cbx-pop{position:absolute;z-index:30;top:calc(100% + 4px);left:0;width:300px;max-width:85vw;background:#fff;border:1px solid var(--ligne);border-radius:4px;box-shadow:0 8px 24px rgba(12,47,71,.18);padding:8px}
.cbx-pop .cbx-q{width:100%;margin-bottom:6px} .cbx-pop ul{list-style:none;margin:0;padding:0;max-height:280px;overflow:auto}
.cbx-g{font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--doux);padding:8px 6px 3px}
.cbx-c{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:3px;font-size:13.5px;cursor:pointer} .cbx-c:hover{background:var(--skyp)} .cbx-c input{width:16px;height:16px;accent-color:var(--sky2);flex:none}
.cbx-fin{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--ligne2);margin-top:6px;padding-top:8px}
.cbx-pop li button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:3px;font-size:13.5px} .cbx-pop li button:hover,.cbx-pop li button.on{background:var(--skyp)}
.up-fl svg{transition:transform .18s} .up-fl.ouv svg{transform:rotate(90deg)}

/* =====================================================================

/* SANDBOX : l'heure et le jour sont réels, sur la même horloge que le front employé (sandbox/centre-partage.js).

let AUJ = SBT ? SBT.j : 2;                 // index du jour courant depuis le lundi de départ

  return ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'].map((n, i) => { const d = new Date(d0); d.setDate(d.getDate() + i); return { i, long: n + ' ' + d.getDate() + ' ' + M[d.getMonth()], court: n.slice(0, 3).toLowerCase() + '. ' + d.getDate() }; }); })();

const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

/* ---- Moteur d'affectation : générique, piloté par le modèle de l'activité ---- */
const TAMPON = 10;
function estLibre(jour, resId, s, e, t = TAMPON) {
  return !CENTRE.reservations.some(r => r.jour === jour && r.blocs.some(b => b.r === resId && s < b.e + t && e > b.s - t));
}
function affecter(act, pers, jour, debut, dureeMin) {
  if (act.modele === 'vente') return [];
  if (act.modele === 'combo') {
    let t = debut; const out = [];
    for (const et of act.etapes) {
      t += et.apres || 0;
      const b = affecter(actById(et.act), pers, jour, t, et.duree);
      if (!b) return null;
      out.push(...b); t += et.duree;
    }
    return out;
  }
  const dispo = act.ressources.filter(r => !r.hs && estLibre(jour, r.id, debut, debut + dureeMin, act.battement != null ? act.battement : TAMPON));
  const bloc = r => ({ r: r.id, s: debut, e: debut + dureeMin });
  if (act.modele === 'piste' || act.modele === 'table') {          // n ressources voisines
    const n = Math.max(1, Math.ceil(pers / act.ressources[0].cap));
    for (let i = 0; i + n <= act.ressources.length; i++) {
      const lot = act.ressources.slice(i, i + n);
      if (lot.every(r => dispo.includes(r))) return lot.map(bloc);
    }
    return null;
  }
  const salle = dispo.filter(r => r.cap >= pers).sort((a, b) => a.cap - b.cap)[0];   // plus petite salle suffisante
  return salle ? [bloc(salle)] : null;
}
let _seq = 0;
function creerReservation(d) {
  const act = actById(d.act);
  const dureeMin = d.duree || act.duree;
  const blocs = affecter(act, d.pers, d.jour, d.debut, dureeMin);
  if (!blocs) return { erreur: 'Aucune ressource libre pour ' + d.pers + ' personnes à ' + hm(d.debut) + '.' };
  const f = act.formules.find(x => x.nom === d.formule) || act.formules[0];
  const total = d.total != null ? d.total : (/joueur|enfant/.test(f.unite) ? f.prix * d.pers : f.prix * Math.max(1, blocs.length));
  const r = { id: 'r' + (++_seq), num: 2690 + _seq * 7, jour: d.jour, client: d.client, titre: d.titre || '', act: act.id, formule: f.nom,
    pers: d.pers, debut: d.debut, duree: dureeMin, canal: d.canal || 'Comptoir', total, paye: d.paye != null ? d.paye : total, arrive: !!d.arrive, blocs, joueurs: d.joueurs };
  CENTRE.reservations.push(r);
  return r;
}
const reste = r => Math.max(0, r.total - r.paye);
const libelleRessources = r => {
  if (!r.blocs.length) return '—';
  const noms = r.blocs.map(b => resById(b.r).nom);
  const p = noms.filter(n => n.startsWith('Piste ')).map(n => n.slice(6));
  const autres = noms.filter(n => !n.startsWith('Piste '));
  return [p.length ? (p.length > 1 ? 'Pistes ' : 'Piste ') + p.join('-') : '', ...autres].filter(Boolean).join(' · ');
};
function etatResa(r) {
  if (r.arrive) return { code: 'arrive', txt: 'Arrivé' };
  if (r.jour < AUJ) return { code: 'termine', txt: 'Terminé' };
  if (r.jour === AUJ && r.debut < NOW) return { code: 'retard', txt: 'En retard' };
  return { code: 'attendu', txt: 'Attendu' };
}
const duJour = j => CENTRE.reservations.filter(r => r.jour === j).sort((a, b) => a.debut - b.debut);
function etatRessource(res) {
  if (res.hs) return { code: 'hs', txt: 'Hors service', sous: 'Maintenance' };
  const lst = duJour(AUJ).filter(r => r.blocs.some(b => b.r === res.id));
  for (const r of lst) {
    const b = r.blocs.find(x => x.r === res.id);
    if (b.s <= NOW && NOW < b.e) return r.arrive
      ? { code: 'occupee', txt: 'En cours', sous: 'reste ' + (b.e - NOW) + ' min', resa: r }
      : { code: 'reservee', txt: 'Réservée', sous: 'attendu ' + hm(b.s), resa: r };
  }
  const next = lst.map(r => ({ r, b: r.blocs.find(x => x.r === res.id) })).filter(x => x.b.s > NOW)[0];
  return next ? { code: 'libre', txt: 'Libre', sous: 'jusqu’à ' + hm(next.b.s), resa: next.r } : { code: 'libre', txt: 'Libre', sous: 'ce soir' };
}
function anomalies() {
  /* un paiement accepté sans commande ni réservation rattachée (TRANS, état « anomalie ») ; une borne qui ne se signale plus (heartbeat) */
  const out = TRANS.filter(t => t.etat === 'anomalie').map(t => ({ id: t.num, grave: true, titre: 'Paiement encaissé sans commande', detail: libBorne(t.borne) + ' · ' + t.h + ' · ' + eur(t.montant), action: 'Voir', trans: t.num }));

}

function creerActivite(f) {
  const m = modele(f.modele);
  const id = 'act' + (CENTRE.activites.length + 1);
  const nb = Math.max(1, parseInt(f.nb, 10) || 1), cap = Math.max(1, parseInt(f.cap, 10) || 1);
  const type = (f.typeRes || m.type || 'Poste').trim();
  const d = parseInt(f.duree, 10) || 60;
  const a = { id, nom: (f.nom || 'Nouvelle activité').trim(), modele: f.modele, c: '#15803d', p: '#86e3a2', etat: 'brouillon', duree: d, canaux: (f.canaux || ['borne', 'comptoir']).slice(),
    ressources: m.id === 'vente' || m.id === 'combo' ? [] : Array.from({ length: nb }, (_, i) => ({ id: id + '-' + (i + 1), nom: type + ' ' + (i + 1), cap })),
    formules: [{ nom: duree(d), unite: f.unite || m.unite, prix: parseFloat(String(f.prix).replace(',', '.')) || 0 }],
    regles: m.id === 'piste' || m.id === 'table'
      ? ['De 1 à ' + cap + ' joueurs → 1 ' + type.toLowerCase(), 'Au-delà → plusieurs ' + type.toLowerCase() + 's côte à côte']
      : m.id === 'vente' || m.id === 'combo' ? [] : ['Le groupe part dans la plus petite ' + type.toLowerCase() + ' qui convient'],
    creneaux: 'Pas de 30 min pendant les heures d’ouverture' };
  CENTRE.activites.push(a);
  if (a.canaux.includes('borne')) CENTRE.bornes.filter(b => b.type === 'Kiosque' && b.zone === 'Hall').forEach(b => b.vend.push(id));
  if (a.canaux.includes('comptoir')) CENTRE.bornes.filter(b => b.type === 'Poste').forEach(b => b.vend.push(id));
  CENTRE.brouillon.push('Activité « ' + a.nom + ' » créée (' + m.nom + ')');
  return a;
}

/* Mini-framework : un état, un rendu, des actions déléguées par data-a="nom" */

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');

function capaciteHeure(a, jour, h) {

  const occupees = new Set(duJour(jour).flatMap(r => r.blocs).filter(bl => a.ressources.some(x => x.id === bl.r) && bl.s < fin && bl.e > deb).map(bl => bl.r)).size;
  if (a.modele === 'piste' || a.modele === 'table') return { cap: dispo.length, pris: duJour(jour).flatMap(r => r.blocs).filter(bl => a.ressources.some(x => x.id === bl.r) && bl.s < fin && bl.e > deb).length, unite: accord(dispo.length, nom), compte: 'ressources' };
  if (a.modele === 'seance') return { cap: dispo.reduce((n, x) => n + x.cap, 0), pris: lst.reduce((n, r) => n + r.pers, 0), unite: accord(dispo.reduce((n, x) => n + x.cap, 0), 'place'), compte: 'places' };

/* ======================= GRAPHIQUES ======================= */
function ligne(pts, o = {}) {
  const W = o.w || 640, H = o.h || 180, pl = 54, pr = 56, pt = 14, pb = 26, w = W - pl - pr, h = H - pt - pb;
  const max = Math.max(...pts.map(p => p.v)) * 1.08 || 1, x = i => pl + i / (pts.length - 1) * w, y = v => pt + h - v / max * h;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const ticks = [0, .5, 1].map(f => Math.round(max * f));
  const step = Math.ceil(pts.length / 8); const labs = pts.map((p, i) => (i % step === 0 && pts.length - 1 - i >= step / 2) || i === pts.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.lib)}</text>` : '').join('');
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${o.r || 3.5}" fill="#fff" stroke="${o.c || 'var(--n)'}" stroke-width="2"><title>${esc(p.lib)} : ${o.fmt ? o.fmt(p.v) : p.v}</title></circle>`).join('');
  const fin = pts[pts.length - 1];
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.titre || '')}">${ticks.map(t => `<line class="gr" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${fmtK(t)}</text>`).join('')}
    <path d="${d} L${x(pts.length - 1)} ${pt + h} L${pl} ${pt + h}Z" fill="${o.c || 'var(--n)'}" opacity=".08"/><path d="${d}" fill="none" stroke="${o.c || 'var(--n)'}" stroke-width="2" stroke-linejoin="round"/>${dots}
    <text x="${x(pts.length - 1) + 8}" y="${y(fin.v) + 4}" style="font-weight:700;fill:var(--n)">${o.fmt ? o.fmt(fin.v) : fin.v}</text>${labs}</svg>`;
}
function empile(mois, ids) {
  const W = 640, H = 200, pl = 54, pr = 10, pt = 10, pb = 26, w = W - pl - pr, h = H - pt - pb, n = mois.length, bw = w / n * .62;
  const max = (Math.max(...mois.map(m => m.tot)) || 1) * 1.05, y = v => v / max * h;
  const cols = mois.map((m, i) => { let acc = 0; const x = pl + (i + .5) * w / n - bw / 2; return ids.map(id => { const v = m.par[id] || 0, yy = pt + h - y(acc + v); acc += v; const a = actById(id); return v ? `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0, y(v) - 2)}" fill="${a.c}"><title>${m.lib} · ${a.nom} : ${eur(v)}</title></rect>` : ''; }).join('') + `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${m.lib}</text>`; }).join('');
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d’affaires mensuel par activité">${[0, .5, 1].map(f => `<line class="gr" x1="${pl}" x2="${W - pr}" y1="${pt + h - y(max * f)}" y2="${pt + h - y(max * f)}"/><text x="${pl - 6}" y="${pt + h - y(max * f) + 4}" text-anchor="end">${fmtK(Math.round(max * f))}</text>`).join('')}${cols}</svg>`;
}
function barres(items, o = {}) { const max = Math.max(...items.map(i => i.v)) || 1; return `<div class="hb" style="--lw:${o.lw || 150}px">${items.map(it => `<div class="hb-r" title="${esc(it.lib)} : ${o.fmt ? o.fmt(it.v) : it.v}"><span class="hb-l">${esc(it.lib)}</span><span class="hb-t"><i style="width:${(it.v / max * 100).toFixed(1)}%;background:${it.c || 'var(--n)'}"></i></span><b class="hb-v">${o.fmt ? o.fmt(it.v) : it.v}</b></div>`).join('')}</div>`; }
function chaleur(mat, lignes, cols) { const max = Math.max(...mat.flat()) || 1, cw = 36, ch = 26, lw = 46, W = lw + cols.length * cw, H = 20 + lignes.length * ch; return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Affluence par jour et par heure" style="max-width:${W * 1.2}px">${cols.map((c, j) => `<text x="${lw + j * cw + cw / 2}" y="13" text-anchor="middle">${c}</text>`).join('')}${mat.map((row, i) => `<text x="${lw - 8}" y="${20 + i * ch + 17}" text-anchor="end">${lignes[i]}</text>` + row.map((v, j) => `<rect x="${lw + j * cw + 1}" y="${20 + i * ch + 1}" width="${cw - 2}" height="${ch - 2}" fill="var(--n)" opacity="${(0.06 + v / max * .9).toFixed(2)}"><title>${lignes[i]} ${cols[j]} : ${eur(Math.round(v))}</title></rect>`).join('')).join('')}</svg>`; }

        <dt>Canal</dt><dd>${r.canal} · créée le ${r.cree}</dd>
        <dt>Paiement</dt><dd>${pays.map(([l, m]) => `<div class="row"><span class="grow">${l}</span><b class="m" style="font-family:var(--mono)">${eur(m)}</b></div>`).join('')}<div class="row" style="border-top:1px solid var(--ligne2);margin-top:4px;padding-top:4px"><span class="grow">Total</span><b style="font-family:var(--mono)">${eur(r.total)}</b></div></dd>
        <dt>Validation</dt><dd>${r.valide ? 'Le client a validé sur <b>' + r.valide.borne + '</b> à ' + r.valide.h : r.etatV === 'absente' ? 'Pas validée à l’heure : commande annulée automatiquement, places libérées' : a.pointage === 'borne' ? 'En attente : le client validera sur une borne en arrivant' : a.pointage === 'manuel' ? 'À pointer à l’accueil' : 'Sans pointage'}</dd>
        <dt>Caisse</dt><dd>${caisseTxt(r)}${r.act === 'bowling' ? '<br><span class="note">Placement sur les pistes : Conqueror</span>' : a.modele === 'seance' || a.modele === 'privatif' ? '<br><span class="note">Salle : front employé</span>' : ''}</dd></dl>
      ${blocDecaler(r)}
      <div class="row wrap">${btnPointer(r)}${r.caisse.etat === 'reprendre' ? `<button type="button" class="btn pt att" data-a="relancer" data-id="${r.id}">Relancer le bot</button>` : ''}<button type="button" class="btn pt" data-a="toast" data-t="Confirmation renvoyée à ${esc(r.client)}">Renvoyer la confirmation</button>${reste(r) && droit('encaisser') ? `<button type="button" class="btn pt" data-a="encaisser" data-id="${r.id}">Encaisser ${eur(reste(r))}</button>` : ''}${droit('encaisser') ? `<button type="button" class="btn pt" data-a="toast" data-t="Annulation : remboursement de ${eur(r.paye)} selon les règles de l’activité">Annuler la commande</button>` : ''}</div>
      <p class="note">Journal : créée le ${r.cree} (${r.canal})${r.valide ? ' · validée ' + r.valide.h + ' sur ' + r.valide.borne : ''}${r.caisse.ticket ? ' · tapée en caisse, ticket ' + r.caisse.ticket : ''}.</p>
    </div></aside></div>`;
}

/* ======================= TABLEAU DE BORD ======================= */
const WIDGETS = {
  clients: ['Clients', 'w3'], ca: ['Chiffre d’affaires', 'w3'], resa: ['Réservations du jour', 'w3'], bornes: ['Bornes', 'w3'],
  arrivees: ['Prochaines arrivées', 'w6'], traiter: ['À traiter', 'w6'], planning: ['Créneaux et places du jour', 'w12'],
  salles: ['Salles en direct · front employé', 'w12'], caisse: ['Caisse (bot)', 'w3'], ce: ['Tickets CE aujourd’hui', 'w3'], affluence: ['Affluence attendue', 'w6'], top: ['Top bar (7 jours)', 'w6'], canaux: ['Canaux (30 jours)', 'w3'], note: ['Note du jour', 'w3']
};
function widget(id, i) {
  const [nom, w] = WIDGETS[id], lst = duJour(AUJ);
  const outils = S.edit ? `<span class="sp"><button type="button" class="ic" data-a="wmove" data-i="${i}" data-d="-1" aria-label="Déplacer avant">${ic('gauche', 14)}</button><button type="button" class="ic" data-a="wmove" data-i="${i}" data-d="1" aria-label="Déplacer après">${ic('droite', 14)}</button><button type="button" class="ic" data-a="wdel" data-i="${i}" aria-label="Retirer">${ic('croix', 14)}</button></span>` : '';
  const p7 = periode(7), p30 = periode(30), p365 = CA, pr7 = CA.slice(-14, -7), pr30 = CA.slice(-60, -30), auj = CA[CA.length - 1] || { tot: 0, ce: 0, ceVal: 0 }, hier = CA[CA.length - 2] || { tot: 0 };
  const C = {
    clients: () => `<div class="corps trio"><div><span>Semaine</span><b>${somme(p7, x => x.pers).toLocaleString('fr-FR')}</b>${deltaPct(somme(p7, x => x.pers), somme(pr7, x => x.pers))}</div><div><span>Mois</span><b>${somme(p30, x => x.pers).toLocaleString('fr-FR')}</b>${deltaPct(somme(p30, x => x.pers), somme(pr30, x => x.pers))}</div><div><span>Année</span><b>${somme(p365, x => x.pers).toLocaleString('fr-FR')}</b><span class="note" style="text-transform:none;letter-spacing:0;font-weight:400">participants</span></div></div><p class="note" style="padding:0 14px 10px">Personnes des réservations, toutes activités · ${(window.SB ? SB.api.clients.liste() : []).length} comptes clients sur le site</p>`,
    ca: () => droit('voir_ca') ? `<div class="corps trio"><div><span>Hier</span><b>${fmtK(hier.tot)}</b></div><div><span>Semaine</span><b>${fmtK(somme(p7, x => x.tot))}</b>${deltaPct(somme(p7, x => x.tot), somme(pr7, x => x.tot))}</div><div><span>Mois</span><b>${fmtK(somme(p30, x => x.tot))}</b>${deltaPct(somme(p30, x => x.tot), somme(pr30, x => x.tot))}</div></div><div style="padding:0 14px 10px">${spark(p30.map(x => x.tot), 'var(--sky2)')}<span class="note"> 30 derniers jours · aujourd’hui ${eur(auj.tot)}</span></div>` : `<div class="corps"><p class="gros masque">Masqué pour ce compte</p><p class="note">Le rôle « ${S.role} » ne voit pas le chiffre d’affaires.</p></div>`,
    resa: () => `<div class="corps trio"><div><span>Résas</span><b>${lst.length}</b></div><div><span>Validées</span><b>${lst.filter(r => r.etatV === 'validee').length}</b></div><div><span>Absentes</span><b style="color:${lst.some(r => r.etatV === 'absente') ? 'var(--rouge)' : 'inherit'}">${lst.filter(r => r.etatV === 'absente').length}</b></div></div><p class="note" style="padding:0 14px 10px">${lst.reduce((n, r) => n + r.pers, 0)} personnes attendues · les clients valident eux-mêmes sur les bornes</p>`,
    bornes: () => `<div class="corps"><div class="chips">${CENTRE.bornes.map(b => `<button type="button" class="chip" data-a="voirBorne" data-id="${b.id}" title="${esc(b.nom)} · ${esc(etatBorneTxt(b))}" style="min-height:28px;padding:0 7px;font-family:var(--mono);font-size:12px${b.eteinte || b.jamais ? ';background:#eceae4;color:var(--doux)' : b.on ? '' : ';border-color:var(--rouge);color:var(--rouge);background:#fbe6e7'}"><i class="dot ${b.eteinte || b.jamais ? 'g' : b.on ? '' : 'off'}" style="width:8px;height:8px;border-radius:50%"></i>${b.id}</button>`).join('')}</div><p class="note" style="margin-top:8px">${CENTRE.bornes.filter(enLigne).length} / ${CENTRE.bornes.length} en ligne${CENTRE.bornes.some(b => b.eteinte) ? ' · ' + CENTRE.bornes.filter(b => b.eteinte).length + ' éteintes' : ''}${CENTRE.bornes.some(b => b.jamais) ? ' · ' + CENTRE.bornes.filter(b => b.jamais).length + ' jamais connectée' + (CENTRE.bornes.filter(b => b.jamais).length > 1 ? 's' : '') : ''} · ${TRANS.filter(t => t.etat === 'ok' && (t.j != null ? t.j : AUJ) === AUJ).length} paiements aujourd’hui</p></div>`,
    arrivees: () => lst.filter(r => r.etatV === 'attendue').slice(0, 6).map(r => `<button type="button" class="lig" style="width:100%;text-align:left" ${ouvrirDetail(r)}><span class="h">${hm(r.debut)}</span><div class="grow"><b>${esc(r.titre || r.client)}</b> ${tag(actById(r.act))}<small>${r.pers} pers. · ${esc(r.formule)} · ${r.canal}${reste(r) && droit('encaisser') ? ' · reste ' + eur(reste(r)) : ''}</small></div>${motV(r)}</button>`).join('') || '<p class="vide">Plus personne d’attendu aujourd’hui.</p>',
    traiter: () => anomaliesD().filter(x => !/retard/.test(x.titre)).map(x => `<div class="lig"><i class="dot ${x.grave ? 'off' : 'warn'}"></i><div class="grow"><b>${esc(x.titre)}</b><small>${esc(x.detail)}</small></div><button type="button" class="btn pt" data-a="anomalie" data-borne="${x.borne || ''}" data-resa="${x.resa || ''}" data-trans="${x.trans || ''}" data-bot="${x.bot ? 1 : ''}">${x.action}</button></div>`).join('') + lst.filter(r => r.etatV === 'absente').map(r => `<div class="lig"><i class="dot g"></i><div class="grow"><b>Non présentée, annulée</b><small>${esc(r.titre || r.client)} · ${actById(r.act).nom} ${hm(r.debut)} · places libérées</small></div><button type="button" class="btn pt" ${ouvrirDetail(r)}>Voir</button></div>`).join('') || '<p class="vide">Rien à traiter.</p>',
    planning: () => `<div class="scrollx">${grilleJour(AUJ)}</div>`,
    caisse: () => `<div class="corps trio"><div><span>Tapées</span><b>${lst.filter(r => r.caisse.etat === 'tape' || r.caisse.etat === 'main').length}</b></div><div><span>En attente</span><b>${lst.filter(r => r.caisse.etat === 'attente').length}</b></div><div><span>À reprendre</span><b style="color:${lst.some(r => r.caisse.etat === 'reprendre') ? 'var(--rouge)' : 'inherit'}">${lst.filter(r => r.caisse.etat === 'reprendre').length}</b></div></div><p class="note" style="padding:0 14px 10px">Le bot tape les commandes sur la caisse (simulé pour l’instant) ; le placement se fait sur Conqueror.</p>`,
    ce: () => `<div class="corps trio"><div><span>Validés</span><b>${auj.ce}</b></div><div><span>Lots actifs</span><b>${LOTS.filter(l => l.etat === 'actif').length}</b></div><div><span>Restants</span><b>${LOTS.filter(l => l.etat === 'actif').reduce((n, l) => n + l.nb - l.utilises - l.annules, 0).toLocaleString('fr-FR')}</b></div></div><p class="note" style="padding:0 14px 10px">Tickets validés aujourd’hui : ${eur(auj.ceVal)} de valeur</p>`,
    affluence: () => `<div class="corps">${barres(HEURES.map(h => ({ lib: (h % 24) + ' h', v: lst.filter(r => r.etatV !== 'absente' && Math.floor(r.debut / 60) === h).reduce((n, r) => n + (+r.pers || 0), 0) })), { lw: 50, fmt: v => v + ' pers.' })}<p class="note">Personnes attendues par heure, d’après les réservations du jour.</p></div>`,
    top: () => { const V = ventesArticles(7), L = Object.entries(V).sort((a, b) => b[1].q - a[1].q).slice(0, 6).map(([n, x]) => ({ lib: n, v: x.q })); return `<div class="corps">${L.length ? barres(L, { lw: 190, fmt: v => v + ' vendus' }) : '<p class="vide">Aucune vente bar sur 7 jours.</p>'}</div>`; },
    canaux: () => `<div class="corps">${barres(CANAUX_CA.map(c => ({ lib: c.nom, v: somme(p30, x => x.canaux[c.id]) })), { lw: 80, fmt: v => droit('voir_ca') ? fmtK(v) : Math.round(v / (somme(p30, x => x.tot) || 1) * 100) + ' %' })}</div>`,
    salles: () => sallesEnDirect(),
    note: () => `<div class="corps"><textarea class="in" rows="3" data-f="noteJour" placeholder="Une consigne pour l’équipe : groupe de 14 à 20 h, préparer deux pistes voisines…" style="width:100%;resize:vertical;font:inherit">${esc(((window.SB && SB.lire('reglages')) || {}).note || '')}</textarea><p class="note" style="margin-top:6px">Enregistrée dans la sandbox : visible sur tous les postes du CRM.</p></div>`
  };
  return `<section class="bloc w ${w}"><header><span class="lab">${nom}</span>${outils}</header>${C[id]()}</section>`;
}

/* ======================= COMMANDE GROUPÉE DES BORNES ======================= */
const ciblesFlotte = () => CENTRE.bornes.filter(b => S.flotteZone === 'tous' || b.zone === S.flotteZone);
function flotteHtml() {
  if (!droit('bornes')) return '';
  const C = ciblesFlotte(), allum = C.filter(enLigne).length, etein = C.filter(b => b.eteinte).length, hors = C.filter(b => !b.on && !b.eteinte).length, conf = S.flotteConf, pl = n => n > 1 ? 's' : '';
  return bloc('Toute la flotte', `${C.length} appareil${pl(C.length)} · ${allum} allumé${pl(allum)}${etein ? ' · ' + etein + ' éteint' + pl(etein) : ''}${hors ? ' · ' + hors + ' hors ligne' : ''}`,
    `<div class="si"><label class="note" for="fz">Appliquer à</label><select id="fz" class="chip" data-f="flotteZone" aria-label="Espace concerné"><option value="tous">Tout le parc</option>${CENTRE.zones.map(z => `<option ${S.flotteZone === z ? 'selected' : ''}>${esc(z)}</option>`).join('')}</select><span class="grow"></span>
      <button type="button" class="btn pt" data-a="flotte" data-x="on" ${etein ? '' : 'disabled'}>Tout allumer</button>
      <button type="button" class="btn pt" data-a="flotte" data-x="restart" ${allum ? '' : 'disabled'}>Tout redémarrer</button>
      <button type="button" class="btn pt att" data-a="flotte" data-x="off" ${allum ? '' : 'disabled'}>Tout éteindre</button></div>
    ${conf ? `<div class="si" style="background:#fdf1dc"><b>${conf === 'off' ? 'Éteindre' : 'Redémarrer'} ${allum} appareil${pl(allum)} ?</b><span class="note">${conf === 'off' ? 'Plus aucune commande ni aucun paiement sur ces appareils tant qu’ils ne sont pas rallumés.' : 'Retour en ligne en deux minutes environ ; un paiement en cours est terminé avant.'}</span><span class="grow"></span><button type="button" class="btn pt ${conf === 'off' ? 'att' : 'pri'}" data-a="flotteOk">Oui, ${conf === 'off' ? 'éteindre' : 'redémarrer'}</button><button type="button" class="btn pt" data-a="flotteNon">Annuler</button></div>` : ''}
    <div class="si note">« Éteindre » met les appareils en veille profonde : l’application reste joignable et peut les rallumer d’ici. Un appareil déjà hors ligne n’est pas touché.</div>`);
}

/* ======================= ÉCRANS DU SOCLE ======================= */

      <div class="widgets">${S.widgets.map(widget).join('')}</div>
      ${S.edit ? `<div class="palette"><span class="lab clair">Ajouter un module</span>${dispo.map(k => `<button type="button" class="btn pt" data-a="wadd" data-id="${k}">${ic('plus', 13)}${WIDGETS[k][0]}</button>`).join('') || '<span class="note">Tous les modules sont déjà affichés.</span>'}</div>` : ''}</div>`;
  },

  planning() {
    const sem = semaineDe(S.jour, 'bowling'), semA = semaineDe(S.jour, 'anniv'), autres = CENTRE.activites.filter(a => a.modele !== 'vente' && a.id !== 'bowling' && a.id !== 'anniv');

    const strip = a => vueJour(a, S.jour, { vues: a.ressources.length > 0 });
    const slot = S.slotSel && Object.values(SLOTS).flat().find(s => s.id === S.slotSel);
    return `<div class="page"><h1>Planning</h1>
      <div class="chips">${navJour(7)}</div>
      ${bloc('Bowling', 'Semaine du ' + jourLib(lundiDe(S.jour)).long.replace(/^\w+ /, '') + ' · ' + sem.reduce((n, d) => n + d.lst.length, 0) + ' réservations', semaine(sem, 'rien'), legendeFormules(formulesDe('bowling'), { etats: true }))}
      ${bloc('Anniversaires', 'Semaine · ' + semA.reduce((n, d) => n + d.lst.length, 0) + ' anniversaires · 11 maximum par jour', semaine(semA, '—'), legendeFormules(formulesDe('anniv')) + `<button type="button" class="btn pt" data-a="ouvrir" data-id="anniv" data-o="planning" style="margin-left:12px">Fiches et options</button>`)}
      ${bloc('Créneaux du ' + jourLib(S.jour).long, 'Une ligne par activité, les places restantes dans chaque créneau', `<div class="chips" style="padding:10px 14px 0">${navJour(1)}</div><div class="corps scrollx" style="display:flex;flex-direction:column;gap:6px">${autres.map(strip).join('')}</div>${slot ? detailSlot(slot) : ''}`, '<span class="leg"><span><i style="--c:#fff"></i>libre</span><span><i style="--c:var(--skyp);border-color:var(--sky2)"></i>partiel</span><span><i style="--c:var(--n)"></i>complet</span><span><i style="--c:#fbe6e7;border-color:var(--rouge)"></i>fermé</span></span>')}</div>`;
  },

  transactions() {
    return `<div class="page"><h1>Transactions</h1><p class="intro">Chaque paiement enregistré : bornes, tablettes, téléphone, site web, et les encaissements saisis au comptoir (CRM, front employé). TPE, monnayeur et paiement en ligne sont simulés pour l’instant ; le ticket de caisse vient du bot ou de Trivec, eux aussi simulés. Un paiement sans commande remonte ici. Cliquez une ligne pour ouvrir le détail.</p>
      ${listeTrans()}</div>`;
  },

  bornes() {
    const o = sous('bornes', 'parc'), zones = CENTRE.zones, e = S.parcEdit;
    const corps = {
      parc: () => flotteHtml() + zones.map((z, zi) => `<div><div class="zoneT">${e ? `<input class="in" value="${esc(z)}" data-f="zone.${zi}" aria-label="Nom de l’espace" style="font:700 16px var(--cond);text-transform:uppercase;letter-spacing:.06em">` : `<h2>${esc(z)}</h2>`}<span class="note">${CENTRE.bornes.filter(b => b.zone === z).length} appareil${CENTRE.bornes.filter(b => b.zone === z).length > 1 ? 's' : ''}</span>${e ? `<button type="button" class="btn pt" data-a="ajouterBorne" data-z="${esc(z)}">${ic('plus', 13)}Borne dans cet espace</button>` : ''}</div><div class="parc">${CENTRE.bornes.filter(b => b.zone === z).map(b => { const tr = TRANS.filter(t => t.borne === b.id && (t.j != null ? t.j : AUJ) === AUJ); return `<article class="borne ${b.eteinte ? 'eteinte' : b.on ? '' : 'off'}">
        <header><i class="dot ${b.eteinte || b.jamais ? 'g' : b.on ? (b.v !== VERSION_APP ? 'warn' : '') : 'off'}"></i>${e ? `<input class="in" value="${esc(b.nom)}" data-f="borneNom.${b.id}" aria-label="Nom de la borne" style="flex:1;min-width:0">` : `<b>${esc(b.nom)}</b>`}<code>${b.id}</code></header>
        ${e ? `<div class="l"><span>Espace</span><select class="in" data-f="borneZone.${b.id}" aria-label="Espace">${zones.map(zz => `<option ${b.zone === zz ? 'selected' : ''}>${esc(zz)}</option>`).join('')}</select></div>` : ''}
        <div class="l">${ic('liste', 14)}<span>État</span><span class="${enLigne(b) ? 'etat ok' : b.eteinte || b.jamais ? 'etat' : 'etat off'}">${etatBorneTxt(b)}</span></div>
        <div class="l">${ic('borne', 14)}<span>Type</span><span>${b.type}</span></div>
        <div class="l">${ic('ok', 14)}<span>TPE</span><span>${b.tpe ? 'aucun terminal relié · paiement simulé (Mode test)' : 'aucun'}</span></div>
        <div class="l">${ic('copie', 14)}<span>Imprimante</span><span>${b.papier != null ? (b.papier < 15 ? '<b style="color:var(--amber)">papier ' + b.papier + ' %</b>' : 'papier ' + b.papier + ' %') : 'non reliée'}</span></div>
        <div class="l">${ic('regle', 14)}<span>Espèces (CashDro)</span>${b.type !== 'Écran' && droit('bornes') ? `<button type="button" class="inter ${cashdroDe(b) ? 'on' : 'off'}" data-a="cashdro" data-id="${b.id}" aria-pressed="${cashdroDe(b)}" title="Sans monnayeur : « Espèces » met la commande bar de côté, payée ensuite sur une grande borne"><span></span>${cashdroDe(b) ? 'Monnayeur' : 'Au comptoir'}</button>` : `<span>${cashdroDe(b) ? 'CashDro' : '—'}</span>`}</div>
        <div class="l">${ic('blocs', 14)}<span>Vend</span><span class="chips" style="justify-content:flex-end;gap:3px">${b.vend.filter(actById).slice(0, 4).map(id => actById(id) ? `<span class="tag" style="--p:${actById(id).p};font-size:11px">${esc(actById(id).nom)}</span>` : '').join('')}${b.vend.filter(actById).length > 4 ? '<span class="note">+' + (b.vend.filter(actById).length - 4) + '</span>' : ''}</span></div>

        <section class="bloc w6"><header><span class="lab">Réconciliation du jour</span><span class="sp">ce que la sandbox a enregistré · pas de rapprochement possible sans TPE, monnayeur ni prestataire reliés</span></header>${table([{ l: 'Source' }, { l: 'Montant', r: 1 }, { l: 'Paiements', r: 1 }, { l: 'Écart' }], src.map(([l, L, note]) => `<tr><td><b>${l}</b></td><td class="m r">${eur(l.startsWith('Tickets') ? L.reduce((n, t) => n + (t.valeur || 0), 0) : somT(L))}</td><td class="m r">${L.length}</td><td class="note">${note}</td></tr>`).concat([`<tr><td><b>Paiement sans commande</b></td><td class="m r">${eur(somT(orph))}</td><td class="m r">${orph.length}</td><td>${orph.length ? '<span class="etat anomalie">à rattacher</span>' : '<span class="etat ok">aucun</span>'}</td></tr>`]), { min: 480 })}</section>
        <section class="bloc w12"><header><span class="lab">Clôtures</span><span class="sp">une par jour, calculée sur les paiements enregistrés · la signature et l’archive inaltérable viendront avec le serveur (NF525)</span></header>${table([{ l: 'Date' }, { l: 'CA TTC', r: 1 }, { l: 'TVA', r: 1 }, { l: 'Transactions', r: 1 }, { l: 'Annulations', r: 1 }, { l: 'Signature' }, { l: '' }], CA.slice(-7).reverse().map(x => `<tr><td class="m">${fmtDate(x.d)}</td><td class="m r">${eur(x.tot)}</td><td class="m r">${eur(Math.round(x.tva * 100) / 100)}</td><td class="m r">${x.trans}</td><td class="m r">${x.annul}</td><td class="m note">— (serveur)</td><td class="r"><button type="button" class="btn pt" data-a="exportCloture" data-j="${x.jour}">Exporter</button></td></tr>`), { min: 760 })}</section></div>`; },
      ce: () => { const nb = somme(per, x => x.ce), val = somme(per, x => x.ceVal), actifs = LOTS.filter(l => l.etat === 'actif'), emis = actifs.reduce((n, l) => n + (+l.nb || 0), 0), util = actifs.reduce((n, l) => n + (+l.utilises || 0), 0), t0 = per.length ? +per[0].d : Date.now(), refus = REFUS_CE.filter(x => x.t >= t0);
        return `<div class="widgets">${kpi('Tickets validés', nb.toLocaleString('fr-FR'), '<span class="note">sur la période</span>')}${kpi('Valeur consommée', eur(val), '<span class="note">valeur des tickets validés</span>')}${kpi('Taux d’utilisation', (emis ? Math.round(util / emis * 100) : 0) + ' %', '<span class="note">lots actifs</span>')}${kpi('Tentatives refusées', String(refus.length), '<span class="note">codes déjà utilisés, expirés ou inconnus</span>')}
        <section class="bloc w12"><header><span class="lab">Consommation par organisme</span></header>${table([{ l: 'Lot' }, { l: 'Organisme' }, { l: 'Contenu' }, { l: 'Émis', r: 1 }, { l: 'Utilisés', r: 1 }, { l: 'Taux', r: 1 }, { l: 'Valeur consommée', r: 1 }, { l: 'État' }], LOTS.map(l => `<tr><td class="m">${l.id}</td><td><b>${esc(l.org)}</b></td><td>${esc(l.contenu)}</td><td class="m r">${l.nb}</td><td class="m r">${l.utilises}</td><td class="m r">${l.nb ? Math.round(l.utilises / l.nb * 100) : 0} %</td><td class="m r">${eur(l.utilises * l.valeur)}</td><td><span class="mot ${l.etat === 'actif' ? 'v' : 'g'}">${l.etat}</span></td></tr>`), { min: 760 })}</section></div>`; }
    };
    return `<div class="page"><h1>Statistiques</h1>${filtres}${sousOnglets('stats', [['ensemble', 'Vue d’ensemble'], ['affluence', 'Affluence et occupation'], ['bar', 'Ventes bar'], ['canaux', 'Canaux et délais'], ['paiements', 'Paiements et clôtures'], ['ce', 'Tickets CE']], 'ensemble')}${corps[o]()}</div>`;
  },

  comptes() {
    const roles = Object.keys(ROLES);
    return `<div class="page"><h1>Comptes et accès</h1><p class="intro">Un compte a un rôle ; un rôle est une liste de droits. L’ordinateur de l’accueil ne voit pas le chiffre d’affaires, le bar ne voit que le bar. Le sélecteur « Voir le CRM en tant que », en haut, montre ce que chaque rôle verra.</p>
      <div class="cols"><div class="grow">${bloc('Comptes', COMPTES.length + ' comptes', table([{ l: 'Compte' }, { l: 'Identifiant' }, { l: 'Rôle' }, { l: 'Dernière connexion' }, { l: 'Actif' }, { l: '' }], COMPTES.map((c, i) => `<tr><td><b>${esc(c.nom)}</b>${c.note ? `<small style="display:block;color:var(--doux)">${esc(c.note)}</small>` : ''}</td><td class="m">${c.login}</td><td><select class="chip" data-f="compte.${i}" style="min-height:30px">${roles.map(r => `<option ${c.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></td><td class="note" title="Pas encore de connexion par compte : viendra avec le serveur">—</td><td><button type="button" class="inter ${c.actif ? 'on' : 'off'}" data-a="compteActif" data-i="${i}" aria-pressed="${c.actif}"><span></span>${c.actif ? 'Oui' : 'Non'}</button></td><td class="r"><button type="button" class="btn pt" data-a="toast" data-t="Lien de réinitialisation envoyé à ${esc(c.nom)}">Mot de passe</button></td></tr>`), { min: 760 }), `<button type="button" class="btn pt pri" data-a="toast" data-t="Nouveau compte : choisissez un rôle, l’invitation part par e-mail">${ic('plus', 13)}Nouveau compte</button>`)}</div>
      <div style="flex:1 1 320px">${bloc('Bonnes pratiques', '', `<div class="corps note form"><p>Un poste partagé (accueil, bar) a son propre compte, sans droit sur l’argent ni les tarifs.</p><p>Un prestataire reçoit un accès temporaire, qui expire tout seul.</p><p>Admin et Technicien ont la double authentification obligatoire.</p><p>Chaque action sensible est journalisée : qui, quand, depuis quel poste.</p></div>`)}</div></div>
      ${bloc('Droits par rôle', 'Cliquez une case pour donner ou retirer un droit', table([{ l: 'Droit' }, ...roles.map(r => ({ l: r, c: 1 }))], DROITS.map(([id, lib]) => `<tr><td>${lib}</td>${roles.map(r => `<td class="c"><button type="button" class="case ${peut(r, id) ? 'on' : ''}" data-a="droit" data-r="${r}" data-id="${id}" aria-pressed="${peut(r, id)}" aria-label="${r} : ${esc(lib)}">${ic('ok', 14)}</button></td>`).join('')}</tr>`), { min: 820 }))}</div>`;
  },

  sandbox() {
    const o = sous('sandbox', 'activites'), a = actById(S.act) || CENTRE.activites[0], m = modele(a.modele), e = S.edit, R = a.ressources;
    const pm = (act, v) => e ? `<span class="pm"><button type="button" class="ic" data-a="${act}" data-d="-1" aria-label="Moins">−</button>${v}<button type="button" class="ic" data-a="${act}" data-d="1" aria-label="Plus">+</button></span>` : `<span class="pm">${v}</span>`;
    const B = (lab, titre, corps, droite) => `<section class="bloc"><header><span class="lab">${lab}</span><b>${titre}</b><span class="sp">${droite || ''}</span></header>${corps}</section><div class="lien"></div>`;
    const dispo = PALETTE_BLOCS.filter(p => !a.extra.includes(p.id));
    const corps = {
      activites: () => `<div class="cols"><div class="snav">${CENTRE.activites.map(x => `<button type="button" class="${x.id === a.id ? 'on' : ''}" data-a="act" data-id="${x.id}">${esc(x.nom)}${x.etat === 'brouillon' ? ' <span class="br" style="font:700 10px var(--mono);color:var(--acc)">BROUILLON</span>' : ''}<small style="display:block;color:var(--doux);font-weight:400">${modele(x.modele).nom}</small></button>`).join('')}</div>
        <div class="grow"><p class="intro" style="margin:0 0 12px">Une activité est une pile de blocs. ${e ? 'Chaque bloc se règle ici ; rien n’est visible des clients avant publication.' : 'Activez le mode édition (en haut) pour la modifier.'}</p><div class="recette">
        ${B('Modèle', m.nom, `<div class="corps note">${m.desc}</div>`)}
        ${R.length ? B('Capacité', new Set(R.map(x => x.nom.replace(/\s*\d+$/, ''))).size === 1 && R.length > 1 ? R.length + ' × ' + esc(R[0].nom.replace(/\s*\d+$/, '')) : R.length + ' ressource' + (R.length > 1 ? 's' : ''), `<div class="si"><span class="mot">COMBIEN</span>${pm('resNb', R.length)}<span class="mot">${R.every(x => x.cap === R[0].cap) ? 'PERSONNES CHACUNE' : 'CAPACITÉS'}</span>${R.every(x => x.cap === R[0].cap) ? pm('resCap', R[0].cap) : R.map(x => `<span class="chip on">${esc(x.nom)} · ${x.cap}</span>`).join('')}</div>
          <div class="si note">Sert à calculer les places restantes par créneau. ${a.modele === 'piste' ? 'Le placement sur les pistes se fait sur Conqueror.' : 'Le placement en salle se fait dans le front employé.'}</div><div class="si">${R.map(x => `<button type="button" class="chip ${x.hs ? '' : 'on'}" data-a="hs" data-id="${x.id}" aria-pressed="${!x.hs}" style="${x.hs ? 'color:var(--rouge);border-color:var(--rouge);text-decoration:line-through;background:#fff' : ''}">${esc(x.nom)}</button>`).join('')}</div>`) : a.modele === 'combo' ? B('Enchaînement', 'Utilise d’autres activités', `<div class="si"><div class="flux">${a.etapes.map((x, i) => (i ? '<span class="fle"></span>' : '') + `<span class="pas">${actById(x.act).nom} · ${duree(x.duree)}</span>`).join('')}</div></div>`) : ''}
        ${B('Formules', a.formules.length + ' formule' + (a.formules.length > 1 ? 's' : ''), a.formules.map((f, i) => `<div class="lig">${e ? `<input class="chip" style="min-height:32px;flex:1" aria-label="Nom" value="${esc(f.nom)}" data-f="F.${i}.nom"><input class="chip" style="min-height:32px;width:90px" aria-label="Prix" value="${String(f.prix).replace('.', ',')}" data-f="F.${i}.prix">` : `<b class="grow">${esc(f.nom)}</b><span style="font:700 14px var(--mono)">${f.prix ? eur(f.prix) : ''}</span>`}<span class="note">${esc(f.unite)}</span>${e ? `<button type="button" class="ic" data-a="supFormule" data-i="${i}" aria-label="Supprimer">${ic('croix', 13)}</button>` : ''}</div>`).join('') + (e ? `<div class="si"><button type="button" class="btn pt" data-a="addFormule">${ic('plus', 13)}Ajouter une formule</button><span class="note">Les grilles (week-end, vacances, happy hour) se règlent dans l’onglet Tarifs de l’activité.</span></div>` : ''))}
        ${B('Règles', 'Valables sur le site, les bornes et au comptoir', a.regles.map((x, i) => { const k = x.indexOf('→'), si = k < 0 ? x : x.slice(0, k), al = k < 0 ? '' : x.slice(k + 1); return `<div class="si">${al ? `<span class="mot">SI</span><span>${esc(si.trim())}</span><span class="mot al">ALORS</span><b>${esc(al.trim())}</b>` : `<span class="mot">TOUJOURS</span><span>${esc(x)}</span>`}${e ? `<button type="button" class="ic" style="margin-left:auto" data-a="supRegle" data-i="${i}" aria-label="Supprimer">${ic('croix', 13)}</button>` : ''}</div>`; }).join('') + (e ? `<div class="si"><select class="chip" style="min-height:32px" data-f="regle.type" aria-label="Type de règle">${['Maximum par jour', 'Acompte demandé (en %)', 'Âge minimum', 'Fermer la vente avant (en min)'].map(t => `<option ${S.regle.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select><input class="chip" style="min-height:32px;width:80px" type="number" min="0" value="${S.regle.n}" data-f="regle.n" aria-label="Valeur"><button type="button" class="btn pt" data-a="addRegle">${ic('plus', 13)}Ajouter</button></div>` : ''))}
        ${B('Parcours borne', 'Ce que le client traverse', `<div class="si"><div class="flux">${a.parcours.map((p, i) => (i ? '<span class="fle"></span>' : '') + (e && i > 0 && i < a.parcours.length - 1 ? `<button type="button" class="pas ${p.on ? '' : 'off'}" data-a="pas" data-i="${i}" aria-pressed="${p.on}">${p.n}</button>` : `<span class="pas ${p.on ? '' : 'off'}">${p.n}</span>`)).join('')}</div></div>${e ? '<div class="si note">Cliquez sur une étape du milieu pour la retirer ou la remettre.</div>' : ''}`)}
        ${B('Vente', 'Où elle est proposée', `<div class="si">${CANAUX.map(c => e ? `<button type="button" class="chip ${a.canaux.includes(c.id) ? 'on' : ''}" data-a="canal" data-id="${c.id}" aria-pressed="${a.canaux.includes(c.id)}">${c.nom}</button>` : a.canaux.includes(c.id) ? `<span class="chip on">${c.nom}</span>` : '').join('')}<span class="note">· ${CENTRE.bornes.filter(b => b.vend.includes(a.id)).length} bornes sur ${CENTRE.bornes.length}</span></div>`)}
        ${a.extra.map(id => { const p = PALETTE_BLOCS.find(x => x.id === id); return B(p.nom, 'Bloc optionnel', `<div class="corps">${p.txt}</div>`, e ? `<button type="button" class="ic" data-a="extraDel" data-id="${id}" aria-label="Retirer ce bloc">${ic('croix', 13)}</button>` : ''); }).join('')}
        ${e ? `<div class="palette"><span class="lab">Ajouter un bloc</span>${dispo.map(p => `<button type="button" class="btn pt" data-a="extraAdd" data-id="${p.id}" title="${esc(p.txt)}">${ic('plus', 13)}${p.nom}</button>`).join('') || '<span class="note">Tous les blocs optionnels sont déjà posés.</span>'}${a.etat === 'brouillon' ? boutonSupAct(a, 'Supprimer ce brouillon') : ''}</div>` : `<div><button type="button" class="btn" data-a="edit">Modifier cette activité</button></div>`}</div></div></div>`,
      nouvelle: () => { const q = S.nouv; return `<div class="cols"><div class="grow">${bloc('Départ', 'Copier une activité qui lui ressemble, ou partir d’un modèle vide', `<div class="corps form"><label class="champ">Nom<input value="${esc(q.nom)}" data-f="nouv.nom"></label>
        <label class="champ">Partir de<select data-f="nouv.base"><optgroup label="Copier une activité du centre">${CENTRE.activites.map(x => `<option value="a:${x.id}" ${q.base === 'a:' + x.id ? 'selected' : ''}>Copie de ${esc(x.nom)}</option>`).join('')}</optgroup><optgroup label="Modèle vide">${MODELES.map(x => `<option value="m:${x.id}" ${q.base === 'm:' + x.id ? 'selected' : ''}>${x.nom} (comme ${x.ex})</option>`).join('')}</optgroup></select></label>
        <div><button type="button" class="btn pri" data-a="creer">${ic('plus', 15)}Créer en brouillon et ouvrir ses blocs</button></div><p class="note">Un brouillon n’est visible que dans le CRM et sur une borne de test. Il faut publier pour que le site et les bornes le proposent.</p></div>`)}</div>
        <div style="flex:1 1 380px" class="widgets">${MODELES.map(x => `<section class="bloc w6"><header><span class="lab">Modèle</span><b>${x.nom}</b></header><div class="corps note">${x.desc}<br><b style="color:var(--encre)">Comme : ${x.ex}</b></div></section>`).join('')}</div></div>`; },
      modele: () => { const n = CENTRE.brouillon.length; return `<div class="widgets"><section class="bloc w5" style="grid-column:span 5"><header><span class="lab">Version</span><b>v${CENTRE.version} en service</b></header>${CENTRE.brouillon.map(x => `<div class="lig"><i class="dot warn"></i><span>${esc(x)}</span></div>`).join('') || '<p class="vide">Aucune modification en attente.</p>'}<div class="lig"><button type="button" class="btn ${n ? 'acc' : ''}" data-a="publier">${n ? 'Publier la v' + (CENTRE.version + 1) : 'Tout est publié'}</button><button type="button" class="btn" data-a="toast" data-t="Nouveau centre préparé avec le modèle v${CENTRE.version} : il ne reste qu’à le nommer">${ic('copie', 15)}Ouvrir un centre avec ce modèle</button></div><div class="corps note">Tout ce qui est assemblé ici tient dans un fichier. C’est lui qu’on copie pour ouvrir un autre centre : les blocs voyagent, jamais les clients ni la caisse.</div></section>

    };
    return `<div class="page"><h1>Sandbox</h1><p class="intro">Le terrain où le centre crée ses activités et modifie ce qui les définit, sans nous. Ce qui change les horaires de vente se règle dans le générateur de créneaux ; ce qui change les prix, dans l’onglet de l’activité.</p>

  },

  generateur() {
    const a = actById(S.genAct), R = CRENEAUX[S.genAct], j = R[S.genJour];
    const cell = (c, i) => { const r = R[i][c]; return `<td style="white-space:nowrap"><button type="button" class="inter ${r.ouvert ? 'on' : 'off'}" data-a="genOuvert" data-i="${i}" data-c="${c}" aria-pressed="${r.ouvert}"><span></span>${r.ouvert ? r.debut + ' → ' + r.fin : 'fermé'}</button></td>`; };
    const slots = { web: genererCreneaux(j.web), borne: genererCreneaux(j.borne), comptoir: genererCreneaux(j.comptoir) };
    return `<div class="page"><h1>Générateur de créneaux</h1><p class="intro">Pour chaque activité : quels jours, à quelles heures et sur quel canal on peut réserver. Le site web peut fermer le samedi alors que le comptoir vend toute la journée. Les créneaux sont recalculés à chaque réservation, jamais stockés à l’avance.</p>
      <div class="chips"><span class="lab clair">Activité</span>${CENTRE.activites.filter(x => x.modele !== 'vente').map(x => `<button type="button" class="chip ${S.genAct === x.id ? 'on' : ''}" data-a="genAct" data-id="${x.id}" style="--p:${x.p}"><i></i>${esc(x.nom)}</button>`).join('')}</div>
      <div class="cols"><div class="grow">${bloc('Règles de ' + esc(a.nom), 'Une ligne par jour, une colonne par canal', table([{ l: 'Jour' }, { l: 'Site web' }, { l: 'Bornes' }, { l: 'Comptoir' }, { l: 'Pas' }, { l: '' }], R.map((r, i) => `<tr style="${S.genJour === i ? 'background:var(--peche)' : ''}"><td><b>${r.jour}</b></td>${cell('web', i)}${cell('borne', i)}${cell('comptoir', i)}<td><select class="chip" style="min-height:30px" data-f="genPas.${i}" aria-label="Pas"><option value="30" ${r.comptoir.pas === 30 ? 'selected' : ''}>30 min</option><option value="60" ${r.comptoir.pas === 60 ? 'selected' : ''}>1 h</option><option value="15" ${r.comptoir.pas === 15 ? 'selected' : ''}>15 min</option></select></td><td class="r"><button type="button" class="btn pt" data-a="genJour" data-i="${i}">Aperçu</button></td></tr>`), { min: 700 }), `<button type="button" class="btn pt" data-a="genCopier">Copier le lundi sur la semaine</button>`)}
        <div style="height:14px"></div>${bloc('Exceptions', 'Jours fériés, vacances, événements', table([{ l: 'Date' }, { l: 'Libellé' }, { l: 'Règle' }, { l: '' }], EXCEPTIONS.map(x => `<tr><td class="m">${x.date}</td><td><b>${x.lib}</b></td><td>${x.regle}</td><td class="r"><button type="button" class="ic" data-a="toast" data-t="Exception retirée" aria-label="Retirer">${ic('croix', 13)}</button></td></tr>`), { min: 520 }), `<button type="button" class="btn pt" data-a="toast" data-t="Nouvelle exception : date, libellé, règle">${ic('plus', 13)}Ajouter</button>`)}</div>
      <div style="flex:1 1 320px">${bloc('Aperçu', j.jour + ' · ' + esc(a.nom), `<div class="corps form">${['web', 'borne', 'comptoir'].map(c => `<div><p class="et" style="padding:0;margin-bottom:6px">${CANAUX.find(x => x.id === c).nom} · ${slots[c].length} créneau${slots[c].length > 1 ? 'x' : ''}</p><div class="chips">${slots[c].length ? slots[c].map(h => `<span class="chip" style="min-height:26px;padding:0 7px;font-family:var(--mono);font-size:12px">${h}</span>`).join('') : '<span class="note">Pas de vente ce jour-là sur ce canal.</span>'}</div></div>`).join('')}<p class="note">Heures d’ouverture du jour, pas de ${j.comptoir.pas} min, battement de 10 min appliqué par le moteur.</p></div>`)}</div></div></div>`;
  },

  diffusion() {
    return `<div class="page"><h1>Paramètres de diffusion</h1><p class="intro">Ce que toutes les bornes affichent en commun : les boutons de l’écran d’accueil, l’écran de veille, le bandeau, les langues. Le thème (logo, couleurs) vient du centre et s’applique aussi ici.</p>
      ${diffusionCorps()}</div>`;
  },

  bar() {

/* renommer une formule : ses templates et ses créneaux générés suivent (les réservations passées gardent leur nom)
   ponytail: suit la frappe lettre à lettre ; un nom intermédiaire identique à une autre formule les confondrait dans les templates */
function renommerFormule(act, ancien, nouveau) {
  if (!ancien || ancien === nouveau) return;
  (TEMPLATES[act] || []).forEach(t => { (t.regles || []).forEach(r => { if (r.formules) r.formules = r.formules.map(n => n === ancien ? nouveau : n); });
    if (t.places && ancien in t.places) { t.places[nouveau] = t.places[ancien]; delete t.places[ancien]; } });
  (SLOTS[act] || []).forEach(sl => (sl.formules || []).forEach(x => { if (x.nom === ancien) x.nom = nouveau; }));
}
/* ce qui empêche une activité de se vendre à l'avance (bornes, site) : pas de créneau à venir, une formule fantôme dans les créneaux, une formule jamais proposée */

  const fantomes = dans.filter(n => !F.includes(n)), absentes = F.filter(n => !dans.includes(n)), q = n => '« ' + esc(n) + ' »', liste = L2 => L2.map(q).join(', ');

          <p class="note" data-nouv="apercu">Aperçu : ${q.nb} × ${esc(q.ressNom || 'ressource')} · ${q.ressources.slice(0, Math.max(1, parseInt(q.nb, 10) || 1)).reduce((n, x) => n + x.cap, 0)} personnes en même temps · ${q.fonct === 'piste' || q.fonct === 'table' ? 'un groupe de plus de ' + q.cap + ' prend plusieurs ' + esc((q.ressNom || 'ressource').toLowerCase()) + 's' : 'chaque groupe a sa ressource à lui : la plus petite qui peut l’accueillir'}.</p>`}</div>${sansRes(q.fonct) ? '' : `<div style="border-top:1px solid var(--ligne2)"><div class="si" style="border-top:0;padding-bottom:0"><span class="lab clair">Créneaux</span><b>Temps entre deux groupes</b></div><div data-nouv="lies">${editeurLies(q, 'nouv')}</div></div>`}`)}
        ${bloc('2 · Formules et prix', 'Tout reste modifiable ensuite dans l’activité', `<div style="padding-top:10px">${editeurPrix(q.formules, 'nouv', { duree: !sansRes(q.fonct), note: 'Exemple : 1 partie 7,50 € du lundi au vendredi de 13 h à 17 h, 8,50 € ensuite, 9 € le week-end ; ou un prix différent à partir de 7 personnes.' })}</div>`)}

  /* ---------- GÉNÉRATEUR DE CRÉNEAUX ---------- */

    const t = T.find(x => x.id === g.tpl);
    if (!g.formules || g.formules.act !== g.act) g.formules = Object.assign({ act: g.act }, Object.fromEntries(P.map((f, i) => [f.nom, { inclus: true, places: placesDefaut(a, i) }])));
    const nb = t ? (() => { let n = 0; for (let j = jourDeIso(g.du); j <= jourDeIso(g.au); j++) n += heuresTemplate(t, jsem(j), ctxJour(j)).length; return n; })() : (() => { let n = 0; for (let j = jourDeIso(g.du); j <= jourDeIso(g.au); j++) if (g.jours.includes(jsem(j))) n++; const f = g.fin === '00:00' ? 24 * 60 : mn(g.fin); return n * Math.max(0, Math.floor((f - mn(g.debut)) / g.pas)); })();
    const corps = {
      generer: () => choixModele(g, T) + (t ? genTplHtml(g, a, t, nb) : `<div class="cols"><div class="grow">${bloc('Fabriquer des créneaux', esc(a.nom), `<div class="corps form">

        <p class="note">${lie(a) ? 'Créneaux liés : les places ne se saisissent pas, elles se calculent. Une réservation occupe sa ressource (' + esc((a.ressNom || 'ressource').toLowerCase()) + ') pendant la durée de sa formule' + (a.battement ? ' + ' + a.battement + ' min' : '') + ' et ferme les créneaux qu’elle chevauche. Réglage dans la Sandbox ou l’onglet Réglages de l’activité.' : a.modele === 'seance' ? 'Pour une activité à la séance, les places comptent des personnes.' : 'Ici, les places comptent des réservations (groupes).'}</p><div class="chips"><span class="lab clair">Canaux</span>${CANAUX.map(c => `<button type="button" class="chip ${g.canaux.includes(c.id) ? 'on' : ''}" data-a="genCanal" data-id="${c.id}" aria-pressed="${g.canaux.includes(c.id)}">${c.nom}</button>`).join('')}</div>

/* Grille par ressource (onglet Créneaux) : une ligne par salle, une colonne par créneau du jour.
   Case libre : les durées encore réservables à partir de cette heure dans cette salle (un clic la ferme) ;
   réservation à sa vraie durée (un clic ouvre la commande) ; fermeture à la main (un clic la rouvre) ; battement. */
function grilleSalles(a, j, jour) {
  const E = { config: { activites: CENTRE.activites, prix: PRIX, regles: CRENEAUX }, creneaux: SLOTS, reservations: CENTRE.reservations, blocages: BLOCAGES };
  const M = SB.moteur, t = M.battement(a), F = (PRIX[a.id] || []).map(f => ({ nom: f.nom, d: M.dureeFormule(E, a, f.nom), salles: (f.salles || []).length ? f.salles : null }));
  const finJour = Math.max(...jour.map(finSlot)), nomR = esc((a.ressNom || 'ressource').toLowerCase());
  const resas = duJour(j).filter(r => M.actives(r));
  const ligne = x => {
    let html = '', k = 0;
    while (k < jour.length) {
      const sl = jour[k], d = mn(sl.h), f = finSlot(sl);
      const r = resas.find(y => y.blocs.some(b => b.r === x.id && b.s < f && b.e > d)), b = !r && BLOCAGES.find(y => y.j === j && y.r === x.id && y.s < f && y.e > d);
      if (r || b) {                                           // une réservation ou une fermeture couvre une ou plusieurs colonnes
        const bl = r ? r.blocs.find(y => y.r === x.id && y.s < f && y.e > d) : b; let n = 1;

        else html += `<td colspan="${n}"><button type="button" class="gs-c gs-x" data-a="salleRouvrir" data-id="${b.id}" title="Rouvrir ${esc(x.nom)} (fermée ${hm(b.s)}–${hm(b.e)}${b.par ? ' par ' + esc(b.par) : ''})"><b>✕ fermée</b><small>${hm(b.s)}–${hm(b.e)}</small></button></td>`;

        if (!F.some(permis)) { html += `<td><span class="gs-c gs-off" title="${esc(x.nom)} n’est ouverte à aucune formule à ${sl.h} (template)">pas ouverte</span></td>`; k++; continue; }
        const ok = F.filter(fo => permis(fo) && d + fo.d <= finJour && M.peutPlacer(E, a, x, j, d, d + fo.d, 0).ok);

}

/* ---------- Fiches de commande : bar et transactions ---------- */
const eur2 = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const lignesCmd = (L, o = {}) => L.map(([n, q, pu, t]) => { const det = [q > 1 ? eur2(pu) + ' l’unité' : '', o.tva && t ? 'TVA ' + String(t).replace('.', ',') + ' %' : ''].filter(Boolean).join(' · ');

/* Bowling : les joueurs par piste, comme envoyés au bot (BO004-1, BO004-2…), barrières signalées.

/* Contenu d'une transaction : un paiement bowling est rangé par piste (une ligne par joueur serait trop longue) */

function tiroirTrans() {

/* ---------- Fiche d'un ticket CE ou code promo (Tickets CE › Liste des codes) : son QR code, son lot, son historique ---------- */
const ETAT_CODE = { disponible: 'v', 'utilisé': 'g', 'annulé': 'r' };
function tiroirCode() {

        <dt>Valeur</dt><dd>${l.valeur != null ? eur(l.valeur) + (l.prixVente ? ' · vendu ' + eur(l.prixVente) + ' à l’organisme' : ' · offert') : '—'}</dd>
        <dt>Validité</dt><dd>${l.debut ? 'du ' + l.debut + ' au ' + l.fin : '—'}${l.etat && l.etat !== 'actif' ? ` <span class="mot o">lot ${l.etat}</span>` : ''}</dd>
        <dt>Lot</dt><dd><button type="button" class="lienb" data-a="codeLot" data-id="${c.lot}">${c.lot}</button>${n ? ' · ticket n° ' + n + (l.nb ? ' sur ' + l.nb : '') : ''}</dd>
        <dt>Contact</dt><dd>${l.contact ? esc(l.contact) : '—'}</dd>
        <dt>Utilisation</dt><dd>${c.etat === 'utilisé' ? 'Utilisé' + (c.quand ? ' le ' + esc(c.quand) : '') + (c.ou ? ' · ' + esc(c.ou) : '') : c.etat === 'annulé' ? 'Annulé : refusé partout' : 'Pas encore utilisé · usage unique, sur les bornes, au comptoir et sur le site'}</dd></dl>
      ${U.length ? `<div><span class="lab clair">Passages en caisse</span>${U.map(u => `<div class="lig"><span class="h">${esc(u.h)}</span><div class="grow"><b>${esc(u.quoi)}</b><small>${esc(u.ou)}${u.cmd != null ? ' · commande n° ' + u.cmd : ''}</small></div></div>`).join('')}</div>` : ''}
      <div class="row wrap">${c.etat === 'disponible' ? `<button type="button" class="btn att" data-a="codeAnnuler" data-c="${c.code}">Annuler ce code</button>` : `<button type="button" class="btn pt" data-a="codeReactiver" data-c="${c.code}">Réactiver ce code</button>`}<span class="note">${c.etat === 'disponible' ? 'Un code annulé est refusé partout ; il peut être réactivé ensuite.' : 'Réactivé, il redevient utilisable une fois.'}</span></div>
    </div></aside></div>`;
}
/* le QR code en image PNG (600 px), pour un courrier, une affiche ou un e-mail à l'organisme */
function pngQr(code) {
  const im = new Image();
  im.onload = () => { const cv = Object.assign(document.createElement('canvas'), { width: 600, height: 600 }), g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(im, 0, 0, 600, 600);
    cv.toBlob(b => { const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(b), download: 'QR-' + code + '.png' }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }); };
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(qrSvg(code).replace('<svg ', '<svg width="600" height="600" '));
}
/* le ticket à imprimer : QR code, code, organisme, contenu, validité */
function imprimerTicket(code) {
  const c = CODES.find(x => x.code === code), l = LOTS.find(x => x.id === c.lot) || {}, w = window.open('', '_blank', 'width=520,height=720');
  if (!w) { S.toast = 'Le navigateur a bloqué la fenêtre d’impression : autorisez les fenêtres pour ce site'; return; }
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Ticket ${esc(code)}</title><style>body{margin:0;font-family:Barlow,Arial,sans-serif;color:#0c2f47}.t{width:80mm;margin:8mm auto;border:2px dashed #0c2f47;border-radius:4mm;padding:6mm;text-align:center}.t img{height:16mm}.t svg{width:52mm;height:52mm;display:block;margin:3mm auto}.t b{display:block;font-size:15pt;text-transform:uppercase}.t code{font:700 12pt monospace;letter-spacing:.04em}.t p{margin:2mm 0;font-size:10pt}@media print{.t{margin:0 auto}}</style></head><body><div class="t"><img src="${LOGO}" alt=""><b>${esc(c.contenu)}</b><p>${esc(c.org)}</p>${qrSvg(code)}<code>${esc(code)}</code><p>Valable du ${esc(l.debut || '')} au ${esc(l.fin || '')} · usage unique</p><p>À présenter sur une borne, au comptoir ou à saisir sur le site.</p></div><script>onload = () => { print(); }<\/script></body></html>`);
  w.document.close();
