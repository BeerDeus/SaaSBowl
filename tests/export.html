<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copie de la sandbox</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3efe6;color:#1a2430;font:16px/1.5 system-ui,sans-serif}
main{max-width:520px;background:#fffdf9;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(12,47,71,.12);text-align:center}
h1{margin:0 0 8px;color:#0c2f47;font-size:22px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;background:#d9272e;color:#fff;padding:14px 22px;cursor:pointer;margin-top:14px}
p{color:#5b6b78}
</style>
</head>
<body>
<!-- Outil de diagnostic (pas pour Hostinger) : enregistre une copie de la sandbox de ce navigateur (clés « sbx:* ») dans un fichier,
     pour qu'on puisse l'examiner. Ne modifie rien. -->
<main>
  <h1>Copie de la sandbox</h1>
  <p>Enregistre une copie des données de la sandbox de ce navigateur (activités, formules, réglages, réservations) dans le dossier Téléchargements. Rien n’est modifié.</p>
  <button type="button" id="go">Télécharger la copie</button>
  <p id="fin"></p>
</main>
<script>
document.getElementById('go').addEventListener('click', () => {
  const o = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('sbx:')) o[k] = localStorage.getItem(k); }
  const b = new Blob([JSON.stringify(o)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'sandbox-export.json'; document.body.appendChild(a); a.click(); a.remove();
  document.getElementById('fin').textContent = Object.keys(o).length + ' éléments copiés dans « sandbox-export.json » (dossier Téléchargements).';
});
</script>
</body>
</html>
