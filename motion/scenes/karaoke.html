<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidéo · Karaoké</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="../kit.css">
<style>
/* Présentation du karaoké, 15 s, ambiance néon : l'enseigne « Karaoké » qui s'allume sous un micro, des paroles qui se colorent
   comme sur l'écran du karaoké, la salle privée (jusqu'à 10 personnes, 30 min ou 1 h, d'après le CRM), « Réserve ta salle ici ».
   Pas de prix : la vidéo ne vieillit pas quand les tarifs changent. */
:root{--neon-rose:#ff4fd8;--neon-cyan:#3ff0ff;--violet:#7c3aed}
#scene{background:#090318}
.fond-k{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 38%,#3b1475,transparent 70%),radial-gradient(120% 50% at 50% 110%,#4a0f5e,transparent 70%),linear-gradient(#07021a,#14062e 55%,#0b0320)}
/* projecteurs : deux faisceaux qui balaient la salle */
.projo{position:absolute;top:-80px;width:760px;height:2300px;margin-left:-380px;transform-origin:50% 0;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(var(--c),transparent 75%);opacity:.32;filter:blur(18px);mix-blend-mode:screen;animation:balaye 3.4s ease-in-out infinite alternate}
@keyframes balaye{from{rotate:var(--r1)}to{rotate:var(--r2)}}
/* égaliseur en bas (au-dessus du bouton « Touchez l'écran ») */
.eq{position:absolute;left:30px;right:30px;top:1470px;height:160px;display:flex;align-items:flex-end;gap:10px}
.eq i{flex:1;height:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(0deg,var(--violet),var(--neon-rose) 55%,var(--neon-cyan));transform-origin:50% 100%;box-shadow:0 0 18px rgba(255,79,216,.45);opacity:.85;animation:eq var(--d) ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
.note{position:absolute;top:2000px;font:700 var(--fs) var(--txt);color:var(--c);text-shadow:0 0 18px var(--c);animation:noteMonte var(--d) linear var(--a) both}
.note span{display:block;animation:balance 1.8s ease-in-out infinite alternate}
@keyframes noteMonte{from{transform:translateY(0)}to{transform:translateY(-2400px)}}
/* néon : un tube éteint (à peine visible), puis il s'allume en grésillant */
.neon{color:#ffeefc;text-shadow:0 0 8px var(--n1),0 0 24px var(--n1),0 0 60px var(--n1),0 0 110px var(--n2)}
.neon .l{animation:allume .9s linear calc(var(--a) + var(--i) * .08s) both}
@keyframes allume{0%{opacity:.1}8%{opacity:1}13%{opacity:.25}21%{opacity:1}28%{opacity:.45}36%,100%{opacity:1}}
.rose{--n1:var(--neon-rose);--n2:var(--violet)}.cyan{--n1:var(--neon-cyan);--n2:#2563eb}
/* le micro qui descend au bout de son câble, puis se balance */
.micro{position:absolute;left:540px;top:0;width:250px;margin-left:-125px;animation:descend 1s cubic-bezier(.3,1.35,.5,1) var(--a) both}
.micro svg{display:block;width:100%;height:auto;transform-origin:50% 0;animation:balance 2.4s ease-in-out infinite alternate;filter:drop-shadow(0 0 30px rgba(255,79,216,.55))}
@keyframes descend{from{transform:translateY(-760px)}to{transform:none}}
.ondes{position:absolute;left:540px;top:340px}
.ondes i{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;border:6px solid var(--c);opacity:0;animation:pulse 1.6s ease-out var(--a) infinite}
/* l'écran du karaoké : paroles qui se colorent mot après mot */
.ecran-k{position:absolute;left:60px;top:330px;width:960px;height:800px;border-radius:40px;background:rgba(8,3,24,.72);border:5px solid var(--neon-cyan);box-shadow:0 0 30px rgba(63,240,255,.55),inset 0 0 40px rgba(63,240,255,.15);animation:pop .7s var(--rebond) var(--a) both}
.ecran-k header{position:absolute;left:44px;right:44px;top:34px;display:flex;justify-content:space-between;font:700 40px var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--neon-cyan)}
.ecran-k header b{color:var(--neon-rose)}
.paroles{position:absolute;left:0;right:0;top:170px;display:flex;flex-direction:column;align-items:center;gap:14px}
.parole{position:relative;width:fit-content;font:700 104px/1.05 var(--cond);text-transform:uppercase;color:rgba(255,255,255,.26)}
.parole::after{content:attr(data-t);position:absolute;inset:0;color:#ffe14f;text-shadow:0 0 22px rgba(255,79,216,.9);clip-path:inset(-20% 100% -20% 0);animation:chante .62s linear var(--a) forwards}
@keyframes chante{to{clip-path:inset(-20% 0 -20% 0)}}
.avance{position:absolute;left:44px;right:44px;bottom:42px;height:12px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.avance i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--neon-rose),var(--neon-cyan));transform-origin:0 50%;animation:avance 3s linear var(--a) both}
@keyframes avance{from{transform:scaleX(0)}to{transform:none}}
/* la salle privée : cartes au bord néon */
.carte{position:absolute;left:90px;width:900px;height:196px;border-radius:36px;background:rgba(10,4,30,.78);border:4px solid var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 60%,transparent);display:flex;align-items:center;gap:34px;padding:0 40px}
.carte .ico{flex:none;font-size:92px;filter:drop-shadow(0 0 14px var(--c))}
.carte b{display:block;white-space:nowrap;font:700 84px/1 var(--cond);text-transform:uppercase;color:#fff;text-shadow:0 0 16px var(--c)}
.carte small{display:block;font:600 38px var(--txt);color:#d9cdf5;margin-top:6px}
.gauche{animation:glisseG .8s var(--rebond) var(--a) both}.droite{animation:glisseD .8s var(--rebond) var(--a) both}
@keyframes glisseG{from{opacity:0;transform:translateX(-1200px) rotate(-8deg)}to{opacity:1;transform:rotate(-1.5deg)}}
@keyframes glisseD{from{opacity:0;transform:translateX(1200px) rotate(8deg)}to{opacity:1;transform:rotate(1.5deg)}}
/* fin */
.logo{width:540px;filter:drop-shadow(0 0 30px rgba(255,79,216,.45)) drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.flotte{animation:flotte 3s ease-in-out infinite}
.main{position:relative;width:220px;height:220px;display:grid;place-items:center}
.main svg{width:170px;height:170px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;rotate:180deg;filter:drop-shadow(0 0 12px var(--neon-cyan))}
.main i{position:absolute;inset:0;border-radius:50%;border:6px solid var(--neon-cyan);opacity:0;animation:pulse 1.3s ease-out var(--a) infinite}
.main i+i{animation-delay:calc(var(--a) + .65s)}
</style>
</head>
<body data-duree="15">
<div class="cadre"><div id="scene">
  <div class="fond-k"></div>
  <div class="ciel" id="ciel"></div>
  <span class="projo" style="left:120px;--c:var(--neon-rose);--r1:-28deg;--r2:18deg"></span>
  <span class="projo" style="left:960px;--c:var(--neon-cyan);--r1:26deg;--r2:-16deg;animation-delay:-1.7s"></span>
  <div id="notes"></div>
  <div class="eq" id="eq"></div>

  <!-- 1. Le micro et l'enseigne (0 → 2,75 s) -->
  <div class="plan" style="--a:0s;--b:2.75s">
    <div class="micro" style="--a:0.1s"><svg viewBox="0 0 200 420" aria-hidden="true">
      <defs><radialGradient id="grille" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#f4f4fa"/><stop offset=".45" stop-color="#9a9ab0"/><stop offset="1" stop-color="#3a3a4e"/></radialGradient>
        <pattern id="maille" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.7" fill="#1b1b28" opacity=".55"/></pattern>
        <linearGradient id="corps" x1="0" x2="1"><stop offset="0" stop-color="#151522"/><stop offset=".35" stop-color="#4a4a62"/><stop offset=".55" stop-color="#20202e"/><stop offset="1" stop-color="#0c0c14"/></linearGradient></defs>
      <path d="M100 0C96 40 104 80 100 120S98 170 100 190" fill="none" stroke="#1b1b28" stroke-width="7"/>
      <circle cx="100" cy="262" r="74" fill="url(#grille)"/><circle cx="100" cy="262" r="74" fill="url(#maille)"/>
      <ellipse cx="74" cy="232" rx="20" ry="12" fill="#fff" opacity=".55" transform="rotate(-35 74 232)"/>
      <rect x="58" y="326" width="84" height="22" rx="6" fill="#f5c542"/><rect x="58" y="330" width="84" height="5" fill="#fff" opacity=".45"/>
      <path d="M64 348h72l-14 70H78z" fill="url(#corps)"/>
    </svg></div>
    <div class="ondes"><i style="--c:var(--neon-rose);--a:1.1s"></i><i style="--c:var(--neon-cyan);--a:1.9s"></i></div>
    <div class="centre" style="top:760px">
      <div class="titre neon rose" style="--fs:250px;--a:0.75s" data-lettres>Karaoké</div>
      <p class="monte" style="--a:1.6s;margin-top:34px;font:600 64px var(--txt);color:#e9dcff;letter-spacing:.03em">Chante en salle privée</p>
    </div>
  </div>

  <!-- 2. Les paroles à l'écran (2,95 → 6,15 s) -->
  <div class="plan" style="--a:2.95s;--b:6.15s">
    <div class="ecran-k" style="--a:3s">
      <header><span>♪ À toi de chanter</span><b>● REC</b></header>
      <div class="paroles">
        <p class="parole" data-t="Prends le micro," style="--a:3.3s">Prends le micro,</p>
        <p class="parole" data-t="monte le son," style="--a:4s">monte le son,</p>
        <p class="parole" data-t="chante avec" style="--a:4.7s">chante avec</p>
        <p class="parole" data-t="ta bande !" style="--a:5.4s">ta bande&nbsp;!</p>
      </div>
      <div class="avance"><i style="--a:3.1s"></i></div>
    </div>
  </div>

  <!-- 3. La salle privée (6,35 → 12,3 s : le temps de lire) -->
  <div class="plan" style="--a:6.35s;--b:12.3s">
    <div class="centre" style="top:270px"><span class="masque"><b class="titre neon cyan" style="--fs:136px;--a:6.4s">Ta salle privée</b></span></div>
    <div class="carte gauche" style="top:540px;--a:6.6s;--c:var(--neon-rose)"><span class="ico">🎤</span><div><b>Jusqu’à 10</b><small>personnes dans la salle</small></div></div>
    <div class="carte droite" style="top:780px;--a:6.8s;--c:var(--neon-cyan)"><span class="ico">⏱️</span><div><b>30 min ou 1 h</b><small>à vous de choisir</small></div></div>
    <div class="carte gauche" style="top:1020px;--a:7s;--c:#ffe14f"><span class="ico">🎉</span><div><b>Rien que vous</b><small>entre amis, en famille, entre collègues</small></div></div>
  </div>

  <!-- 4. Réserve ici (12,5 → 15 s) -->
  <div class="plan" style="--a:12.5s;--b:99s">
    <div class="centre" style="top:150px"><div class="pop" style="--a:12.55s"><img class="logo flotte" src="../../logo.png" alt=""></div></div>
    <div class="centre" style="top:720px">
      <span class="masque"><b class="titre" style="--fs:122px;--a:12.75s;white-space:nowrap">Réserve ta salle</b></span>
      <div class="titre neon rose" style="--fs:320px;--a:12.95s;margin-top:4px;white-space:nowrap" data-lettres>ici&#8239;!</div>
    </div>
    <div class="centre" style="top:1230px"><div class="main pop" style="--a:13.45s"><i style="--a:13.55s"></i><i style="--a:13.55s"></i><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 013 0v5M12 10V4a1.5 1.5 0 013 0v6M15 10V6.5a1.5 1.5 0 013 0V14c0 4-2.5 7-6 7-3 0-4.5-1.5-6-4l-2-3.5a1.5 1.5 0 012.5-1.6L9 14"/></svg></div></div>
  </div>

  <!-- volets entre les plans, au-dessus de tout -->
  <span class="volet" style="--c:var(--neon-rose);--a:2.45s"></span>
  <span class="volet" style="--c:var(--neon-cyan);--a:5.85s"></span>
  <span class="volet" style="--c:var(--violet);--a:12s"></span>
  <div id="confettis"></div>
</div></div>
<script src="../kit.js"></script>
<script>
  document.querySelectorAll('[data-lettres]').forEach(KIT.lettres);
  KIT.etoiles(document.getElementById('ciel'), 50);
  /* égaliseur : 24 barres, chacune à son rythme */
  document.getElementById('eq').innerHTML = Array.from({ length: 24 }, () => `<i style="--d:${KIT.entre(.28, .7).toFixed(2)}s;animation-delay:-${KIT.entre(0, 1).toFixed(2)}s"></i>`).join('');
  /* notes de musique qui montent sur les côtés */
  const C = ['#ff4fd8', '#3ff0ff', '#ffe14f'], S = ['♪', '♫', '♬'];
  document.getElementById('notes').innerHTML = Array.from({ length: 22 }, (_, k) => { const g = k % 2 ? KIT.entre(20, 260) : KIT.entre(780, 1000);
    return `<span class="note" style="left:${g.toFixed(0)}px;--fs:${KIT.entre(70, 130).toFixed(0)}px;--c:${C[k % 3]};--d:${KIT.entre(7, 10).toFixed(1)}s;--a:${(k * .8 - 4).toFixed(1)}s"><span>${S[k % 3]}</span></span>`; }).join('');
  KIT.confettis(document.getElementById('confettis'), 120, { x: 540, y: 1000, a: 13.1, couleurs: ['#ff4fd8', '#3ff0ff', '#ffe14f', '#ffffff', '#7c3aed'] });
</script>
</body>
</html>
